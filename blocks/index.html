<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>かくかく合体バトル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&display=swap">
<style>
  /* Layout: full-screen canvas arena; HUD floats in the corners, controls bottom-right, start/death card centered. Graph-paper look on purpose, single theme. */
  :root {
    --bg: #eef1f6;
    --ink: #1c2433;
    --muted: #6a7790;
    --panel: rgba(255,255,255,.88);
    --accent: #2f6bff;
    --hot: #ff5a3c;
    --display: "Rubik", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: var(--display); touch-action: none; user-select: none; -webkit-user-select: none; }
  #cv { position: fixed; inset: 0; display: block; }
  .hud { position: fixed; pointer-events: none; z-index: 2; }
  #score { top: calc(10px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px));
    background: var(--panel); border-radius: 10px; padding: 6px 12px; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; line-height: 1.4; }
  #score small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
  #resetBtn { position: fixed; z-index: 6; top: calc(64px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px));
    border: 0; border-radius: 10px; padding: 6px 12px; font: inherit; font-weight: 800; font-size: 13px; background: var(--panel); color: var(--ink); cursor: pointer; }
  #resetBtn.armed { background: var(--hot); color: #fff; }
  #board { top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
    background: var(--panel); border-radius: 10px; padding: 8px 10px; font-size: 12px; min-width: 140px; max-width: 46vw; }
  #board h4 { margin: 0 0 4px; font-size: 13px; text-align: center; }
  #board ol { margin: 0; padding-left: 22px; }
  #board li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.45; }
  #board li span { float: right; margin-left: 8px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #board li.me { color: var(--accent); font-weight: 800; }
  #mini { display: block; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    width: 110px; height: 110px; background: var(--panel); border-radius: 10px; }
  #flash { left: 50%; top: calc(110px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: rgba(28,36,51,.85); color: #fff;
    padding: 6px 14px; border-radius: 99px; font-size: 13px; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  .btns { position: fixed; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 10px; z-index: 3; align-items: flex-end; }
  .btns button { width: 66px; height: 66px; border-radius: 50%; border: 0; font: inherit; font-weight: 800; font-size: 13px; color: #fff;
    box-shadow: 0 4px 0 rgba(0,0,0,.18); opacity: .9; line-height: 1.1; }
  .btns button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  .rot { background: var(--accent); font-size: 24px !important; }
  #detachBtn { background: var(--hot); }
  #menu { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; z-index: 5; background: rgba(238,241,246,.6); }
  #menu[hidden], #resetBtn[hidden] { display: none; }
  .card { background: #fff; border-radius: 22px; padding: 26px 22px; width: 100%; max-width: 350px; text-align: center;
    box-shadow: 0 12px 40px rgba(28,36,51,.18); display: grid; gap: 14px; }
  .card h1 { margin: 0; font-size: 28px; font-weight: 800; color: var(--accent); }
  .card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; text-align: left; }
  .card input { font: inherit; font-size: 16px; padding: 12px; border-radius: 12px; border: 2px solid #d6dce8; text-align: center; color: var(--ink); background: #fff; }
  .card button { font: inherit; font-weight: 800; font-size: 18px; padding: 14px; border: 0; border-radius: 14px; background: var(--accent); color: #fff; cursor: pointer; }
  .card input:focus-visible, .card button:focus-visible, #resetBtn:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }
  .result { font-size: 15px; font-variant-numeric: tabular-nums; }
  .result b { font-size: 28px; display: block; color: var(--accent); }
  @media (hover: hover) and (pointer: fine) { .btns { display: none; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="score" class="hud"></div>
<button id="resetBtn" hidden>↺ リセット</button>
<div id="board" class="hud"><h4>ランキング</h4><ol id="rank"></ol></div>
<canvas id="mini" class="hud"></canvas>
<div id="flash" class="hud"></div>
<div class="btns">
  <button class="rot" id="rotLBtn" aria-label="左に回転">⟲</button>
  <button class="rot" id="rotRBtn" aria-label="右に回転">⟳</button>
  <button id="detachBtn" aria-label="ブロックを切り離す">切り<br>離す</button>
</div>
<div id="menu"><div class="card">
  <h1>かくかく合体バトル</h1>
  <div id="result" class="result" hidden></div>
  <input id="nameIn" maxlength="12" placeholder="なまえ" aria-label="なまえ">
  <button id="playBtn">あそぶ</button>
  <p>・指（マウス）の方向に進んで、散らばったブロックをくっつけよう。<br>
  ・ブロックが正方形（2×2、3×3…）にそろうと<b>合体</b>して大きなブロックになる。<br>
  ・ぶつかると<b>大きいブロックが小さいブロックを壊す</b>。体がなくなったら負け。<br>
  ・回転：A／D　切り離し：W</p>
</div></div>

<script>
// ---------- Tuning ----------
const WORLD = 4000, U = 18, FOOD_N = 1000, BOT_N = 20;
const COLORS = ['#2f6bff', '#ff5a3c', '#18b87a', '#ffb31f', '#9b5cff', '#ff4fa3', '#00a7c7', '#7a8b00', '#e0632a', '#4b5cc4'];
const NAMES = ['カクカク', 'ブロッ子', 'しかくん', 'テトラ', 'ましかく', 'キューブ', 'がったい', 'つみき', 'レンガ', 'マス目',
  'かどっこ', 'ドット', 'ピクセル', 'ボックス', 'タイル', 'かたまり', 'ずっしり', 'カチカチ', 'ぴったり', 'でかしかく'];
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// rotate a vector by k quarter turns
const rotV = (x, y, k) => [[x, y], [-y, x], [-x, -y], [y, -x]][((k % 4) + 4) % 4];

// ---------- State ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const mini = document.getElementById('mini'), mctx = mini.getContext('2d');
let W = 0, H = 0, DPR = 1;
let players = [], me = null, playing = false, best = 0, startT = 0, nextId = 1;
let cam = { x: WORLD / 2, y: WORLD / 2, z: 1 }, pointer = { x: 0, y: 0 };

// loose blocks in a coarse grid
const GS = 100, GN = Math.ceil(WORLD / GS);
let fgrid = [], foodCount = 0, flying = [];
const gk = (x, y) => clamp(Math.floor(y / GS), 0, GN - 1) * GN + clamp(Math.floor(x / GS), 0, GN - 1);
function addFood(x, y, c) { fgrid[gk(x, y)].push({ x, y, c }); foodCount++; }
function topUpFood() { while (foodCount + flying.length < FOOD_N) addFood(rand(20, WORLD - 20), rand(20, WORLD - 20), pick(COLORS)); }

// ---------- Bodies ----------
// a body is a set of square pieces on its own grid: {gx, gy, s}; (cx, cy) is its centroid in grid units,
// and (x, y) is where that centroid sits in the world
const area = p => p.pieces.reduce((a, q) => a + q.s * q.s, 0);
const maxPiece = p => p.pieces.reduce((a, q) => Math.max(a, q.s), 0);
function centroid(p) {
  let a = 0, x = 0, y = 0;
  for (const q of p.pieces) { const m = q.s * q.s; a += m; x += (q.gx + q.s / 2) * m; y += (q.gy + q.s / 2) * m; }
  return a ? [x / a, y / a] : [0, 0];
}
// keep the body still in the world when its centroid moves inside it
function recenter(p) {
  const [nx, ny] = centroid(p);
  const [dx, dy] = rotV((nx - p.cx) * U, (ny - p.cy) * U, p.rot);
  p.x += dx; p.y += dy; p.cx = nx; p.cy = ny;
  let r = 0;
  for (const q of p.pieces) r = Math.max(r, Math.hypot((q.gx + q.s / 2 - p.cx) * U, (q.gy + q.s / 2 - p.cy) * U) + q.s * U * 0.71);
  p.rad = r;
}
function pieceWorld(p, q) {
  const [wx, wy] = rotV((q.gx + q.s / 2 - p.cx) * U, (q.gy + q.s / 2 - p.cy) * U, p.rot);
  return { x: p.x + wx, y: p.y + wy, h: q.s * U / 2 };
}
function worldPieces(p) { return p.ws || (p.ws = p.pieces.map(q => pieceWorld(p, q))); }
function toLocal(p, x, y) {
  const [lx, ly] = rotV(x - p.x, y - p.y, -p.rot);
  return [lx / U + p.cx, ly / U + p.cy];
}
function occupancy(p) {
  const occ = new Map();
  p.pieces.forEach((q, i) => { for (let y = 0; y < q.s; y++) for (let x = 0; x < q.s; x++) occ.set((q.gx + x) + ',' + (q.gy + y), i); });
  return occ;
}
// any fully filled k×k square made only of pieces inside it fuses into one k-piece (largest first)
function mergeAll(p) {
  let merged = 0;
  for (let guard = 0; guard < 50; guard++) {
    const occ = occupancy(p);
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const q of p.pieces) { x0 = Math.min(x0, q.gx); y0 = Math.min(y0, q.gy); x1 = Math.max(x1, q.gx + q.s); y1 = Math.max(y1, q.gy + q.s); }
    const w = x1 - x0, h = y1 - y0;
    // prefix sums of filled cells for O(1) "is this square full" checks
    const S = Array.from({ length: h + 1 }, () => new Int32Array(w + 1));
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) S[y + 1][x + 1] = S[y][x + 1] + S[y + 1][x] - S[y][x] + (occ.has((x0 + x) + ',' + (y0 + y)) ? 1 : 0);
    let done = false;
    for (let k = Math.min(w, h); k >= 2 && !done; k--) {
      for (let y = 0; y + k <= h && !done; y++) for (let x = 0; x + k <= w && !done; x++) {
        if (S[y + k][x + k] - S[y][x + k] - S[y + k][x] + S[y][x] !== k * k) continue;
        const ids = new Set();
        let inside = true;
        for (let yy = 0; yy < k && inside; yy++) for (let xx = 0; xx < k; xx++) {
          const i = occ.get((x0 + x + xx) + ',' + (y0 + y + yy)); const q = p.pieces[i]; ids.add(i);
          if (q.gx < x0 + x || q.gy < y0 + y || q.gx + q.s > x0 + x + k || q.gy + q.s > y0 + y + k) { inside = false; break; }
        }
        if (!inside || ids.size < 2) continue;
        p.pieces = p.pieces.filter((_, i) => !ids.has(i));
        p.pieces.push({ gx: x0 + x, gy: y0 + y, s: k });
        merged = Math.max(merged, k); done = true;
      }
    }
    if (!done) break;
  }
  return merged;
}
// a loose block snaps into the nearest empty cell next to the body
function attach(p, fx, fy) {
  const [lx, ly] = toLocal(p, fx, fy);
  const occ = occupancy(p);
  const cx = Math.floor(lx), cy = Math.floor(ly);
  let bestC = null, bd = Infinity;
  // prefer snug gaps (many filled neighbours) so the body stays compact and squares complete
  for (let dy = -5; dy <= 5; dy++) for (let dx = -5; dx <= 5; dx++) {
    const x = cx + dx, y = cy + dy, key = x + ',' + y;
    if (occ.has(key)) continue;
    let side = 0, corner = 0;
    for (const [ox, oy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (occ.has((x + ox) + ',' + (y + oy))) side++;
    if (!side) continue;
    for (const [ox, oy] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) if (occ.has((x + ox) + ',' + (y + oy))) corner++;
    const d = Math.sqrt((x + 0.5 - lx) ** 2 + (y + 0.5 - ly) ** 2);
    const score = d - side * 1.6 - corner * 0.6;
    if (score < bd) { bd = score; bestC = [x, y]; }
  }
  if (!bestC) return false;
  p.pieces.push({ gx: bestC[0], gy: bestC[1], s: 1 });
  const k = mergeAll(p);
  recenter(p);
  if (k >= 3 && p === me) flash(`合体！ ${k}×${k} ブロック完成`);
  return true;
}
// pieces cut off from the biggest connected chunk fall away as loose blocks
function prune(p) {
  if (!p.pieces.length) return;
  const occ = occupancy(p), comp = new Array(p.pieces.length).fill(-1);
  const comps = [];
  for (let i = 0; i < p.pieces.length; i++) {
    if (comp[i] >= 0) continue;
    const stack = [i], list = []; comp[i] = comps.length;
    while (stack.length) {
      const j = stack.pop(); list.push(j); const q = p.pieces[j];
      for (let t = 0; t < q.s; t++) for (const [x, y] of [[q.gx + t, q.gy - 1], [q.gx + t, q.gy + q.s], [q.gx - 1, q.gy + t], [q.gx + q.s, q.gy + t]]) {
        const n = occ.get(x + ',' + y);
        if (n !== undefined && comp[n] < 0) { comp[n] = comps.length; stack.push(n); }
      }
    }
    comps.push(list);
  }
  if (comps.length < 2) return;
  const sizeOf = l => l.reduce((a, j) => a + p.pieces[j].s ** 2, 0);
  comps.sort((a, b) => sizeOf(b) - sizeOf(a));
  const drop = new Set(comps.slice(1).flat());
  for (const j of drop) shatter(p, p.pieces[j], 0.6);
  p.pieces = p.pieces.filter((_, j) => !drop.has(j));
}
// turn a piece into flying loose blocks
function shatter(p, q, force = 1) {
  const w = pieceWorld(p, q);
  for (let y = 0; y < q.s; y++) for (let x = 0; x < q.s; x++) {
    const [ox, oy] = rotV((x + 0.5 - q.s / 2) * U, (y + 0.5 - q.s / 2) * U, p.rot);
    const a = Math.atan2(oy, ox) + rand(-0.6, 0.6), sp = rand(150, 420) * force;
    flying.push({ x: w.x + ox, y: w.y + oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, c: p.color, t: 0 });
  }
}
function breakPiece(p, i, by) {
  const q = p.pieces[i];
  shatter(p, q);
  p.pieces.splice(i, 1);
  prune(p);
  if (!p.pieces.length) return kill(p, by);
  recenter(p);
}
function detach(p) {
  // let go of the single block furthest toward where you're heading
  let bi = -1, bd = -Infinity;
  p.pieces.forEach((q, i) => {
    if (q.s !== 1) return;
    const w = pieceWorld(p, q), d = (w.x - p.x) * (p.tx - p.x) + (w.y - p.y) * (p.ty - p.y);
    if (d > bd) { bd = d; bi = i; }
  });
  if (bi < 0 || p.pieces.length < 2) { if (p === me) flash('切り離せる1マスのブロックがない'); return; }
  const w = pieceWorld(p, p.pieces[bi]);
  const a = Math.atan2(p.ty - p.y, p.tx - p.x);
  flying.push({ x: w.x + Math.cos(a) * U, y: w.y + Math.sin(a) * U, vx: Math.cos(a) * 650, vy: Math.sin(a) * 650, c: p.color, t: 0, from: p, born: performance.now() });
  p.pieces.splice(bi, 1);
  prune(p); recenter(p);
}
function rotate(p, dir) { p.rot = (p.rot + dir + 4) % 4; p.turn += dir; recenter(p); }

function newPlayer(name, isPlayer, start) {
  const p = { id: nextId++, name, isPlayer, color: pick(COLORS), alive: true, x: 0, y: 0, cx: 0, cy: 0, rot: 0, turn: 0, ang: 0,
    pieces: [], tx: 0, ty: 0, think: 0, shield: 0, rad: U };
  const pos = safeSpot();
  p.x = pos.x; p.y = pos.y; p.tx = pos.x; p.ty = pos.y;
  p.pieces.push({ gx: 0, gy: 0, s: start.core });
  [p.cx, p.cy] = centroid(p); recenter(p);
  for (let i = 0; i < start.extra; i++) { const a = rand(0, Math.PI * 2); attach(p, p.x + Math.cos(a) * p.rad, p.y + Math.sin(a) * p.rad); }
  p.peak = area(p);
  players.push(p);
  return p;
}
function safeSpot() {
  let bestP = { x: rand(300, WORLD - 300), y: rand(300, WORLD - 300) }, gap = -Infinity;
  for (let t = 0; t < 40; t++) {
    const x = rand(300, WORLD - 300), y = rand(300, WORLD - 300);
    let g = Infinity;
    for (const o of players) if (o.alive) g = Math.min(g, Math.hypot(o.x - x, o.y - y) - o.rad * 2);
    if (g > gap) { gap = g; bestP = { x, y }; }
    if (g > 600) break;
  }
  return bestP;
}
function kill(p, by) {
  p.alive = false; p.diedAt = performance.now();
  if (p === me) gameOver(by);
}
function resetWorld() {
  players = []; flying = []; fgrid = Array.from({ length: GN * GN }, () => []); foodCount = 0;
  topUpFood();
  for (let i = 0; i < BOT_N; i++) newPlayer(NAMES[i % NAMES.length], false, { core: Math.ceil(rand(1, 4)), extra: Math.floor(rand(0, 14)) });
}

// ---------- Bots ----------
function botThink(p) {
  const mine = maxPiece(p), view = 650 + p.rad * 2;
  let fx = 0, fy = 0, prey = null, ps = 0;
  for (const o of players) {
    if (o === p || !o.alive) continue;
    const dx = o.x - p.x, dy = o.y - p.y, d = Math.hypot(dx, dy) || 1;
    if (d > view + o.rad) continue;
    const theirs = maxPiece(o);
    if (theirs > mine) { const w = (theirs / mine) * 300 / Math.max(30, d - o.rad - p.rad); fx -= dx / d * w; fy -= dy / d * w; }
    else if (theirs < mine) { const s = area(o) / d; if (s > ps) { ps = s; prey = o; } }
  }
  let tx, ty;
  if (Math.hypot(fx, fy) > 0.8) { tx = p.x + fx * 400; ty = p.y + fy * 400; }
  else if (prey && Math.random() < 0.85) { tx = prey.x; ty = prey.y; }
  else {
    let bf = null, bd = Infinity;
    const k = Math.floor(p.x / GS), l = Math.floor(p.y / GS);
    for (let gy = l - 3; gy <= l + 3; gy++) for (let gx = k - 3; gx <= k + 3; gx++) {
      if (gx < 0 || gy < 0 || gx >= GN || gy >= GN) continue;
      for (const f of fgrid[gy * GN + gx]) { const d = (f.x - p.x) ** 2 + (f.y - p.y) ** 2; if (d < bd) { bd = d; bf = f; } }
    }
    if (bf) { tx = bf.x; ty = bf.y; } else { tx = p.x + rand(-500, 500); ty = p.y + rand(-500, 500); }
  }
  p.tx = clamp(tx, 50, WORLD - 50); p.ty = clamp(ty, 50, WORLD - 50);
  if (Math.random() < 0.04) rotate(p, Math.random() < 0.5 ? 1 : -1);
}

// ---------- Update ----------
function update(dt) {
  const now = performance.now();
  if (me && me.alive) { const w = screenToWorld(pointer.x, pointer.y); me.tx = w.x; me.ty = w.y; }
  for (const p of players) if (p.alive && !p.isPlayer && (p.think -= dt) <= 0) { p.think = rand(0.15, 0.3); botThink(p); }

  for (const p of players) {
    if (!p.alive) continue;
    const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy) || 1;
    const sp = 270 * Math.pow(area(p), -0.2) * Math.min(1, d / 60);
    p.x = clamp(p.x + dx / d * sp * dt, p.rad * 0.5, WORLD - p.rad * 0.5);
    p.y = clamp(p.y + dy / d * sp * dt, p.rad * 0.5, WORLD - p.rad * 0.5);
    p.ang += (p.turn * Math.PI / 2 - p.ang) * Math.min(1, dt * 14);
  }

  // flying blocks slow down and land as loose blocks
  for (const f of flying) {
    f.x += f.vx * dt; f.y += f.vy * dt; const k = Math.pow(0.02, dt); f.vx *= k; f.vy *= k; f.t += dt;
    if (f.t > 0.5 || Math.hypot(f.vx, f.vy) < 30) { f.land = true; addFood(clamp(f.x, 10, WORLD - 10), clamp(f.y, 10, WORLD - 10), f.c); }
  }
  flying = flying.filter(f => !f.land);

  // pick up loose blocks
  for (const p of players) {
    if (!p.alive) continue;
    let budget = 10;
    const x0 = Math.floor((p.x - p.rad) / GS), x1 = Math.floor((p.x + p.rad) / GS), y0 = Math.floor((p.y - p.rad) / GS), y1 = Math.floor((p.y + p.rad) / GS);
    const ws = p.pieces.map(q => pieceWorld(p, q));
    for (let gy = Math.max(0, y0); gy <= Math.min(GN - 1, y1) && budget > 0; gy++) for (let gx = Math.max(0, x0); gx <= Math.min(GN - 1, x1) && budget > 0; gx++) {
      const b = fgrid[gy * GN + gx];
      for (let i = b.length - 1; i >= 0 && budget > 0; i--) {
        const f = b[i];
        if (!ws.some(w => Math.abs(f.x - w.x) < w.h + U * 0.55 && Math.abs(f.y - w.y) < w.h + U * 0.55)) continue;
        b.splice(i, 1); foodCount--;
        if (attach(p, f.x, f.y)) { budget--; ws.length = 0; ws.push(...p.pieces.map(q => pieceWorld(p, q))); }
      }
    }
  }

  // bodies touching: the bigger square breaks the smaller one; equal squares bounce
  const alive = players.filter(p => p.alive);
  for (const p of alive) p.ws = null;
  for (let i = 0; i < alive.length; i++) for (let j = i + 1; j < alive.length; j++) {
    const A = alive[i], B = alive[j];
    if (!A.alive || !B.alive) continue;
    if (Math.hypot(A.x - B.x, A.y - B.y) > A.rad + B.rad) continue;
    let hit = null;
    const WA = worldPieces(A), WB = worldPieces(B);
    for (let a = 0; a < WA.length && !hit; a++) {
      const wa = WA[a];
      if (Math.abs(wa.x - B.x) > B.rad + wa.h || Math.abs(wa.y - B.y) > B.rad + wa.h) continue;
      for (let b = 0; b < WB.length; b++) {
        const wb = WB[b];
        if (Math.abs(wa.x - wb.x) < wa.h + wb.h - 2 && Math.abs(wa.y - wb.y) < wa.h + wb.h - 2) { hit = [a, b]; break; }
      }
    }
    if (!hit) continue;
    const sa = A.pieces[hit[0]].s, sb = B.pieces[hit[1]].s;
    if (sa > sb && B.shield < now) { breakPiece(B, hit[1], A); B.ws = null; }
    else if (sb > sa && A.shield < now) { breakPiece(A, hit[0], B); A.ws = null; }
    else {
      const dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy) || 1, push = 6;
      A.x -= dx / d * push; A.y -= dy / d * push; B.x += dx / d * push; B.y += dy / d * push;
    }
  }

  for (const p of players) if (p.alive) p.peak = Math.max(p.peak, area(p));
  if (me && me.alive) best = Math.max(best, area(me));
  players = players.filter(p => p.alive || p === me || now - p.diedAt < 2000);
  const bots = players.filter(p => !p.isPlayer).length;
  for (let i = bots; i < BOT_N; i++) newPlayer(pick(NAMES), false, { core: Math.ceil(rand(1, 3)), extra: Math.floor(rand(0, 8)) });
  topUpFood();
}

// ---------- Drawing ----------
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  mini.width = 110 * DPR; mini.height = 110 * DPR;
}
addEventListener('resize', resize);
const screenToWorld = (sx, sy) => ({ x: cam.x + (sx - W / 2) / cam.z, y: cam.y + (sy - H / 2) / cam.z });
function updateCam(dt) {
  const base = Math.min(W, H) / 800;
  let tz = base * 0.8, tx = cam.x, ty = cam.y;
  if (me && me.alive) { tx = me.x; ty = me.y; tz = base * 1.4 * Math.pow(Math.max(1, me.rad / 40), -0.55); }
  const k = Math.min(1, dt * 6);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k; cam.z += (tz - cam.z) * Math.min(1, dt * 2);
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), c = v => clamp(Math.round(f > 0 ? v + (255 - v) * f : v * (1 + f)), 0, 255);
  return `rgb(${c(n >> 16)},${c((n >> 8) & 255)},${c(n & 255)})`;
}
function block(x, y, size, color, label) {
  const r = Math.min(6, size * 0.18), m = Math.max(1, size * 0.04);
  ctx.fillStyle = shade(color, -0.3); roundRect(x + m, y + m, size - m * 2, size - m * 2, r); ctx.fill();
  ctx.fillStyle = color; roundRect(x + m * 2, y + m * 2, size - m * 4, size - m * 5, r * 0.8); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.28)'; roundRect(x + m * 3, y + m * 3, size - m * 6, (size - m * 6) * 0.35, r * 0.6); ctx.fill();
  if (label && size * cam.z > 26) {
    ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.font = `800 ${size * 0.32}px Rubik, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, x + size / 2, y + size / 2);
  }
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#e3e8f0'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(cam.z, cam.z); ctx.translate(-cam.x, -cam.y);
  const vw = W / 2 / cam.z, vh = H / 2 / cam.z, x0 = cam.x - vw, x1 = cam.x + vw, y0 = cam.y - vh, y1 = cam.y + vh;
  ctx.fillStyle = '#eef1f6'; ctx.fillRect(0, 0, WORLD, WORLD);
  // graph paper
  ctx.lineWidth = 1 / cam.z;
  for (const [stepV, col] of [[U, '#e2e7f0'], [U * 5, '#d3dae6']]) {
    if (stepV * cam.z < 5) continue;
    ctx.strokeStyle = col; ctx.beginPath();
    for (let x = Math.max(0, Math.floor(x0 / stepV) * stepV); x <= Math.min(WORLD, x1); x += stepV) { ctx.moveTo(x, Math.max(0, y0)); ctx.lineTo(x, Math.min(WORLD, y1)); }
    for (let y = Math.max(0, Math.floor(y0 / stepV) * stepV); y <= Math.min(WORLD, y1); y += stepV) { ctx.moveTo(Math.max(0, x0), y); ctx.lineTo(Math.min(WORLD, x1), y); }
    ctx.stroke();
  }
  ctx.strokeStyle = '#9aa6bb'; ctx.lineWidth = 6; ctx.strokeRect(0, 0, WORLD, WORLD);
  // loose blocks
  const gx0 = Math.max(0, Math.floor(x0 / GS)), gx1 = Math.min(GN - 1, Math.floor(x1 / GS)), gy0 = Math.max(0, Math.floor(y0 / GS)), gy1 = Math.min(GN - 1, Math.floor(y1 / GS));
  const fs = U * 0.8;
  for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) for (const f of fgrid[gy * GN + gx]) block(f.x - fs / 2, f.y - fs / 2, fs, f.c);
  for (const f of flying) block(f.x - fs / 2, f.y - fs / 2, fs, f.c);
  // bodies, biggest first so small ones stay visible
  const vis = players.filter(p => p.alive && p.x + p.rad > x0 && p.x - p.rad < x1 && p.y + p.rad > y0 && p.y - p.rad < y1).sort((a, b) => area(b) - area(a));
  const now = performance.now();
  for (const p of vis) {
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.ang);
    if (p.shield > now && Math.floor(now / 150) % 2) ctx.globalAlpha = 0.5;
    for (const q of p.pieces) block((q.gx - p.cx) * U, (q.gy - p.cy) * U, q.s * U, p.color, q.s >= 2 ? `${q.s}` : '');
    ctx.restore();
    if (p.rad * cam.z > 14) {
      ctx.font = `800 ${Math.max(13, 14 / cam.z * 0.9)}px Rubik, "Hiragino Sans", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.lineWidth = 4 / cam.z; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.fillStyle = p === me ? '#2f6bff' : '#1c2433';
      ctx.strokeText(p.name, p.x, p.y - p.rad - 4); ctx.fillText(p.name, p.x, p.y - p.rad - 4);
    }
  }
  ctx.restore();
  drawMini();
}
function drawMini() {
  const S = 110, k = S / WORLD;
  mctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  mctx.clearRect(0, 0, S, S);
  for (const p of players) {
    if (!p.alive) continue;
    mctx.fillStyle = p === me ? '#2f6bff' : 'rgba(28,36,51,.35)';
    const r = Math.max(p === me ? 3 : 1.5, p.rad * k);
    mctx.fillRect(p.x * k - r, p.y * k - r, r * 2, r * 2);
  }
}

// ---------- HUD ----------
let hudT = 0;
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function updateHud(dt) {
  if ((hudT -= dt) > 0) return;
  hudT = 0.4;
  const alive = players.filter(p => p.alive).sort((a, b) => area(b) - area(a));
  let html = alive.slice(0, 10).map(p => `<li class="${p === me ? 'me' : ''}">${esc(p.name)}<span>${area(p)}</span></li>`).join('');
  const r = alive.indexOf(me);
  if (r >= 10) html += `<li class="me" value="${r + 1}">${esc(me.name)}<span>${area(me)}</span></li>`;
  document.getElementById('rank').innerHTML = html;
  if (me && me.alive) document.getElementById('score').innerHTML = `ブロック ${area(me)}<small>いちばん大きい合体 ${maxPiece(me)}×${maxPiece(me)}</small>`;
}
let flashT = 0;
function flash(t) { const el = document.getElementById('flash'); el.textContent = t; el.style.opacity = 1; clearTimeout(flashT); flashT = setTimeout(() => el.style.opacity = 0, 1400); }

// ---------- Flow ----------
const menu = document.getElementById('menu'), resetBtn = document.getElementById('resetBtn');
function start() {
  const name = document.getElementById('nameIn').value.trim() || 'あなた';
  try { localStorage.setItem('blocks_name', name); } catch (e) {}
  players = players.filter(p => !p.isPlayer);
  me = newPlayer(name, true, { core: 2, extra: 0 });
  me.color = '#2f6bff';
  me.shield = performance.now() + 3000;
  best = area(me); startT = performance.now(); playing = true;
  menu.hidden = true; resetBtn.hidden = false;
  pointer = { x: W / 2, y: H / 2 };
}
function gameOver(by) {
  playing = false;
  const secs = Math.round((performance.now() - startT) / 1000);
  const r = document.getElementById('result');
  r.hidden = false;
  r.innerHTML = `${by ? `「${esc(by.name)}」に壊された！` : 'こわれちゃった！'}<b>最大 ${best} ブロック</b>${Math.floor(secs / 60)}分${secs % 60}秒 生きのびた`;
  document.getElementById('playBtn').textContent = 'もう一回';
  setTimeout(() => { if (!playing) menu.hidden = false; }, 1000);
}
document.getElementById('playBtn').onclick = start;
document.getElementById('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
try { document.getElementById('nameIn').value = localStorage.getItem('blocks_name') || ''; } catch (e) {}

// reset needs a second tap within 2s so a stray touch doesn't wipe the round
let resetArmed = 0;
resetBtn.addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation();
  if (performance.now() < resetArmed || !playing) {
    resetArmed = 0; resetBtn.classList.remove('armed'); resetBtn.textContent = '↺ リセット';
    resetWorld(); start(); flash('最初からやり直し！');
    return;
  }
  resetArmed = performance.now() + 2000;
  resetBtn.classList.add('armed'); resetBtn.textContent = 'もう一度押すとリセット';
  setTimeout(() => { if (performance.now() >= resetArmed) { resetBtn.classList.remove('armed'); resetBtn.textContent = '↺ リセット'; } }, 2050);
});

// ---------- Input ----------
cv.addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY; });
cv.addEventListener('pointerdown', e => { pointer.x = e.clientX; pointer.y = e.clientY; });
addEventListener('keydown', e => {
  if (!playing || e.target.tagName === 'INPUT') return;
  if (e.code === 'KeyA') rotate(me, -1);
  if (e.code === 'KeyD') rotate(me, 1);
  if (e.code === 'KeyW') detach(me);
});
const tapBtn = (id, fn) => document.getElementById(id).addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (playing && me.alive) fn(); });
tapBtn('rotLBtn', () => rotate(me, -1));
tapBtn('rotRBtn', () => rotate(me, 1));
tapBtn('detachBtn', () => detach(me));

// ---------- Loop ----------
let last = performance.now();
let errors = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  try { update(dt); updateCam(dt); draw(); updateHud(dt); }
  catch (err) {
    // never freeze: report once and keep running; the reset button stays usable
    console.error(err);
    if (errors++ === 0) flash('エラーが起きました。止まったらリセットしてね');
  }
  requestAnimationFrame(frame);
}
resize();
resetWorld();
requestAnimationFrame(frame);
</script>
</body>
