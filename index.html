<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pixel Beads</title>
<style>
  :root {
    --bg: #d6cdee;
    --panel: #fffdf4;
    --ink: #3b3355;
    --accent: #7a5cff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", system-ui, sans-serif;
    overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center;
    justify-content: space-between; gap: 8px; z-index: 2;
    padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
  #safeBottom { position: fixed; bottom: 0; left: 0; width: 0; height: env(safe-area-inset-bottom, 0px); pointer-events: none; }
  #hud .title { font-weight: 800; font-size: 20px; letter-spacing: .02em; }
  #hud .stats { font-size: 13px; opacity: .8; white-space: nowrap; }
  #hud > div:last-child { display: flex; gap: 6px; flex-shrink: 0; }
  .btn { border: 0; border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 700;
    background: #fff; color: var(--ink); box-shadow: 0 3px 0 #b9add9; cursor: pointer; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b9add9; }
  .btn.primary { background: var(--accent); color: #fff; box-shadow: 0 4px 0 #5238c8; }
  canvas { display: block; position: fixed; inset: 0; }
  #toast { position: fixed; left: 50%; top: calc(72px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: rgba(59,51,85,.9);
    color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0;
    transition: opacity .25s; pointer-events: none; z-index: 3; white-space: nowrap; }
  #toast.show { opacity: 1; }
  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(40,30,70,.45); z-index: 4; padding: 16px; }
  #overlay.show { display: flex; }
  #overlay .card { background: var(--panel); border-radius: 24px; padding: 28px 24px; text-align: center;
    max-width: 340px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  #overlay h2 { margin: 0 0 8px; font-size: 28px; }
  #overlay p { margin: 0 0 20px; line-height: 1.6; }
  #overlay .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="hud">
  <div>
    <div class="title">Pixel Beads</div>
    <div class="stats"><span id="lv"></span></div>
    <div class="stats">まちがい <span id="left">0</span> ・ 手数 <span id="moves">0</span></div>
  </div>
  <div>
    <button class="btn" id="helpBtn">？</button>
    <button class="btn" id="hintBtn">ヒント</button>
    <button class="btn" id="restartBtn">やり直す</button>
  </div>
</div>
<canvas id="cv"></canvas>
<div id="safeBottom"></div>
<div id="toast"></div>
<div id="overlay"><div class="card">
  <h2 id="ovTitle"></h2>
  <p id="ovText"></p>
  <div class="row" id="ovButtons"></div>
</div></div>

<script>
// ---------- Palette & levels ----------
const PALETTE = {
  'c': '#4fe0ea', // sky cyan
  'K': '#3a3a40', // black
  'W': '#f3efe6', // white
  'g': '#a6d92b', // light green
  'G': '#1f8a1f', // dark green
  'y': '#ffd81f', // yellow
  'r': '#e8364a', // red
  'R': '#a8182c', // dark red
  'b': '#8a5a2b', // brown
  'p': '#ff9ec4', // pink
  'o': '#ff8a1f', // orange
  'B': '#3f6fe0', // blue
  'S': '#bfbfc8', // silver
};

const LEVELS = [
  { name: 'りんご', art: [
    'cccccccccccccccc',
    'cccccccbbccGGccc',
    'cccccccbccGGGccc',
    'ccccccbccGGccccc',
    'ccccrrrbrrrrcccc',
    'cccrrrrrrrrrrccc',
    'ccrrWWrrrrrrrrcc',
    'ccrWWrrrrrrrrrcc',
    'ccrWrrrrrrrrRrcc',
    'ccrrrrrrrrrrRrcc',
    'ccrrrrrrrrrRRrcc',
    'cccrrrrrrrRRrccc',
    'cccrrrrrrRRrrccc',
    'ccccrrrrrrrrcccc',
    'cccccrrccrrccccc',
    'gggggggggggggggg',
  ]},
  { name: 'パンダ', art: [
    'KKKKKKKKKKKKKKKKKKKK',
    'KcKKKccccccccKKKcKKK',
    'cKKKKKWWWWWWWWKKKKcK',
    'cKKKWWWWWWWWWWWWKKcc',
    'ccKWWWWWWWWWWWWWWKcc',
    'ccWWWWWWWWWWWWWWWWcc',
    'cWWKKKWWWWWWWKKKWWWc',
    'cWKKyKKWWWWWKKyKKWWc',
    'cWKKKKWWWWWWWKKKKWWc',
    'cWWKKWWWWKKWWWKKWWWc',
    'cWWWWWWWKKKKWWWWWWWc',
    'cWWWWWWWWKKWWWWWWWWc',
    'ccWWpWWWWWWWWWWpWWcc',
    'ccWWWWWWKWWKWWWWWWcc',
    'cccWWWWWWKKWWWWWWccc',
    'ccccWWWWWWWWWWWWcccc',
    'gggggGWWWWWWWWGggggg',
    'gGggKKKWWWWWWKKKggGg',
    'ggGgKKKKggggKKKKgGgg',
    'gggggggggggggggggggg',
  ]},
  { name: 'きのこ', art: [
    'cccccccccccccccccc',
    'cccccccccccccccccc',
    'ccccccrrrrrrcccccc',
    'ccccrrWWrrrrrrcccc',
    'cccrrWWWWrrrWWrccc',
    'ccrrrWWWrrrWWWWrcc',
    'ccrrrrrrrrrrWWrrcc',
    'crrWWrrrrrrrrrrrrc',
    'crWWWWrrrWWWrrrrrc',
    'crrWWrrrWWWWWrrWrc',
    'crrrrrrrrWWWrrWWWc',
    'cccccWWWWWWWWccccc',
    'cccccWWKWWKWWccccc',
    'cccccWWKWWKWWccccc',
    'cccccWWWWWWWWccccc',
    'ccGcccWWWWWWcccGcc',
    'gGgggggggggggggGgg',
    'gggggggggggggggggg',
  ]},
  { name: 'ひまわり', art: [
    'BBBBBBBBBBBBBBBBBBBBBB',
    'BBBBBBBBBBBBBBBBBWWBBB',
    'BBBBBBBByyyBBBBBWWWWBB',
    'BBBBByyByyyByyBBBBBBBB',
    'BBBByyyyyyyyyyyBBBBBBB',
    'BBByyyyobbbboyyyyBBBBB',
    'BByyyyobbbbbbobyyyBBBB',
    'BBByyobbKbbKbbbyyyBBBB',
    'BByyyobbbbbbbbbbyyBBBB',
    'BByyyobbbKKKbbbyyyBBBB',
    'BBByyyobbbbbbobyyBBBBB',
    'BBBByyyobbbboyyyyBBBBB',
    'BBBBByyyyyyyyyyyBBBBBB',
    'BBBBBByyByyyByyBBBBBBB',
    'BBBBBBBBBGGBBBBBBBBBBB',
    'BBBBBGGGBGGBBBBBBBBBBB',
    'BBBBBBGGGGGBBBGGGBBBBB',
    'BBBBBBBBBGGBGGGBBBBBBB',
    'BBBBBBBBBGGGGBBBBBBBBB',
    'ggggggggggGGgggggggggg',
    'gggpggggggGGggggggpggg',
    'gggggggggggggggggggggg',
  ]},
  { name: 'カエル', art: [
    'cccccccccccccccccccccccc',
    'ccccccccccccccccccWWcccc',
    'ccccGGGGcccccGGGGcWWWccc',
    'cccGWWWWGcccGWWWWGcccccc',
    'cccGWKKWGcccGWKKWGcccccc',
    'cccGWKKWGGGGGWKKWGcccccc',
    'ccGGGWWGGGGGGGWWGGGccccc',
    'cGGGGGGGGGGGGGGGGGGGcccc',
    'cGGpGGGGGGGGGGGGGGpGGccc',
    'cGGGGrrrrrrrrrrrrGGGGccc',
    'ccGGGGrrrrrrrrrrGGGGcccc',
    'cccGGGGGGGGGGGGGGGGccccc',
    'ccccGGggggggggggGGcccccc',
    'cccGGggggggggggggGGccccc',
    'ccGGgggggggggggggggGGccc',
    'ccGGgggggggggggggggGGccc',
    'cGGGGgggggggggggggGGGGcc',
    'GGyGGGgggggggggggGGGyGGc',
    'BBBBBBGGGGGGGGGGGGBBBBBB',
    'BBBBBBBBBBBBBBBBBBBBBBBB',
    'BBBGGGBBBBBBBBBBBBBGGGBB',
    'BBGGGGGBBBBBBBBBBBGGGGGB',
    'BBBGGGBBBBBBBBBBBBBGGGBB',
    'BBBBBBBBBBBBBBBBBBBBBBBB',
  ]},
];

// ---------- Rules ----------
const TRAY_COLS = 12, TRAY_ROWS = 5, TRAY_SIZE = TRAY_COLS * TRAY_ROWS;
const COLOR_ORDER = Object.values(PALETTE);

// ---------- State ----------
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let DPR = 1, VW = 0, VH = 0;
let level = 0, moves = 0;
let W = 0, H = 0;
let cells = [];       // cells[y][x] = {cur, target, reserved}
let holes = [];       // [x, y] in the order they were opened
let beads = [];       // moving / tray beads: {color, x, y, size, state, id, delay, cx, cy}
let particles = [];
let shakes = [];      // {x, y, t}
let hintT = 0;
let nextId = 1;
let state = 'play';   // play | pause | win | lose
let layout = {};
const sprites = new Map();

try { level = Math.min(+localStorage.getItem('pb_level') || 0, LEVELS.length - 1); } catch (e) {}

// ---------- Level setup ----------
function regionsOf() {
  const seen = new Set(), regions = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (seen.has(y * W + x)) continue;
    const color = cells[y][x].target, q = [[x, y]], reg = [];
    seen.add(y * W + x);
    while (q.length) {
      const [cx, cy] = q.shift(); reg.push([cx, cy]);
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nx = cx + dx, ny = cy + dy, k = ny * W + nx;
        if (inside(nx, ny) && !seen.has(k) && cells[ny][nx].target === color) { seen.add(k); q.push([nx, ny]); }
      }
    }
    regions.push({ color, cells: reg });
  }
  return regions;
}

// Scramble by swapping beads between cells, so every color keeps its exact count.
function scramble(swaps, strays) {
  const regions = regionsOf().filter(r => r.cells.length >= 4);
  for (let s = 0; s < swaps && regions.length > 1; s++) {
    const a = regions[Math.floor(Math.random() * regions.length)];
    const others = regions.filter(r => r.color !== a.color);
    if (!others.length) break;
    const b = others[Math.floor(Math.random() * others.length)];
    const n = Math.min(a.cells.length, b.cells.length, 24 + level * 4);
    for (let i = 0; i < n; i++) {
      const [ax, ay] = a.cells[i], [bx, by] = b.cells[i];
      const t = cells[ay][ax].cur; cells[ay][ax].cur = cells[by][bx].cur; cells[by][bx].cur = t;
    }
  }
  for (let s = 0; s < strays; s++) {
    const ax = rnd(W), ay = rnd(H), bx = rnd(W), by = rnd(H);
    const t = cells[ay][ax].cur; cells[ay][ax].cur = cells[by][bx].cur; cells[by][bx].cur = t;
  }
}
const rnd = n => Math.floor(Math.random() * n);

function loadLevel(i) {
  level = i;
  const art = LEVELS[i].art;
  H = art.length;
  W = Math.max(...art.map(r => r.length));
  cells = [];
  for (let y = 0; y < H; y++) {
    const row = [];
    for (let x = 0; x < W; x++) {
      const ch = art[y][x] || art[y][art[y].length - 1];
      const col = PALETTE[ch] || PALETTE.c;
      row.push({ cur: col, target: col, reserved: false });
    }
    cells.push(row);
  }
  scramble(2 + i, 8 + i * 4);
  holes = []; beads = []; particles = []; shakes = []; hintT = 0;
  moves = 0;
  state = 'play';
  hideOverlay();
  updateHud();
  resize();
  try { localStorage.setItem('pb_level', String(i)); } catch (e) {}
}

function updateHud() {
  document.getElementById('lv').textContent = `レベル ${level + 1}「${LEVELS[level].name}」`;
  document.getElementById('moves').textContent = moves;
  let wrong = 0;
  for (const row of cells) for (const c of row) if (c.cur !== c.target) wrong++;
  document.getElementById('left').textContent = wrong;
}

// ---------- Layout ----------
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.width = VW * DPR; cv.height = VH * DPR;
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const pad = 16, top = document.getElementById('hud').getBoundingClientRect().bottom + 4;
  const safeBottom = document.getElementById('safeBottom').getBoundingClientRect().height;
  const maxW = Math.min(VW - pad * 2, 560);
  const slot = Math.floor(Math.min(maxW / TRAY_COLS, (VH * 0.3) / TRAY_ROWS));
  const trayW = slot * TRAY_COLS, trayH = slot * TRAY_ROWS;
  const trayPad = Math.round(slot * 0.35);
  const trayY = VH - pad - safeBottom - trayH - trayPad * 2;
  const availH = trayY - top - 20;
  const cell = Math.max(4, Math.floor(Math.min(maxW / W, availH / H)));
  const boardW = cell * W, boardH = cell * H;
  const old = layout;
  layout = {
    cell, slot, trayPad,
    bx: Math.round((VW - boardW) / 2), by: Math.round(top + (availH - boardH) / 2),
    boardW, boardH,
    tx: Math.round((VW - trayW) / 2), ty: trayY + trayPad, trayW, trayH,
  };
  // keep beads that are mid-air in place relative to the new layout
  if (old.cell) for (const b of beads) { b.size = b.state === 'toBoard' ? cell : slot; }
  sprites.clear();
}
window.addEventListener('resize', resize);

// ---------- Bead sprites ----------
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.max(0, Math.min(255, Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt))));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function beadSprite(color, size) {
  size = Math.max(4, Math.round(size));
  const key = color + '|' + size;
  let s = sprites.get(key);
  if (s) return s;
  s = document.createElement('canvas');
  const px = Math.ceil(size * DPR);
  s.width = s.height = px;
  const c = s.getContext('2d');
  c.scale(DPR, DPR);
  const m = size * 0.06, w = size - m * 2, r = size * 0.28;
  rr(c, m, m, w, w, r);
  c.fillStyle = shade(color, -0.35); c.fill();
  const g = c.createLinearGradient(0, m, 0, m + w);
  g.addColorStop(0, shade(color, 0.35)); g.addColorStop(0.55, color); g.addColorStop(1, shade(color, -0.15));
  rr(c, m + w * 0.07, m + w * 0.05, w * 0.86, w * 0.84, r * 0.8);
  c.fillStyle = g; c.fill();
  // facet highlight
  c.globalAlpha = 0.55;
  c.beginPath();
  c.moveTo(size / 2, m + w * 0.18); c.lineTo(m + w * 0.82, size / 2);
  c.lineTo(size / 2, m + w * 0.78); c.lineTo(m + w * 0.18, size / 2); c.closePath();
  c.fillStyle = shade(color, 0.22); c.fill();
  c.globalAlpha = 0.8;
  c.beginPath(); c.ellipse(m + w * 0.32, m + w * 0.28, w * 0.12, w * 0.07, -0.6, 0, Math.PI * 2);
  c.fillStyle = '#fff'; c.fill();
  sprites.set(key, s);
  return s;
}

// ---------- Rules ----------
const inside = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
const isWrong = (x, y) => cells[y][x].cur && cells[y][x].cur !== cells[y][x].target;
const trayCount = () => beads.filter(b => b.state !== 'toBoard').length;

// connected beads of the same (wrong) color
function collectGroup(sx, sy, cap) {
  const color = cells[sy][sx].cur;
  const seen = new Set([sy * W + sx]);
  const q = [[sx, sy]], out = [];
  while (q.length && out.length < cap) {
    const [x, y] = q.shift();
    out.push([x, y]);
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, ny = y + dy, k = ny * W + nx;
      if (inside(nx, ny) && !seen.has(k) && cells[ny][nx].cur === color && isWrong(nx, ny)) { seen.add(k); q.push([nx, ny]); }
    }
  }
  return out;
}
function sortedTray() {
  return beads.filter(b => b.state !== 'toBoard')
    .sort((a, b) => (COLOR_ORDER.indexOf(a.color) - COLOR_ORDER.indexOf(b.color)) || (a.id - b.id));
}
function slotPos(i) {
  const { tx, ty, slot } = layout;
  return { x: tx + (i % TRAY_COLS) * slot, y: ty + Math.floor(i / TRAY_COLS) * slot };
}

function tap(px, py) {
  if (state !== 'play') return;
  const { bx, by, cell } = layout;
  const x = Math.floor((px - bx) / cell), y = Math.floor((py - by) / cell);
  if (!inside(x, y) || !cells[y][x].cur) return;
  if (!isWrong(x, y)) {
    shakes.push({ x, y, t: 0 });
    toast('そのビーズは正しい色だよ');
    return;
  }
  const free = TRAY_SIZE - trayCount();
  if (free <= 0) { toast('トレイがいっぱい！'); return; }
  const group = collectGroup(x, y, free);
  const color = cells[y][x].cur;
  group.forEach(([gx, gy], i) => {
    cells[gy][gx].cur = null;
    holes.push([gx, gy]);
    beads.push({ color, id: nextId++, state: 'toTray', x: bx + gx * cell, y: by + gy * cell,
      size: cell, delay: i * 0.02 });
  });
  moves++;
  updateHud();
}

// send tray beads to holes that want their color
function dispatch() {
  let sent = 0;
  for (const b of beads) {
    if (b.state !== 'tray' || sent >= 3) continue;
    const idx = holes.findIndex(([x, y]) => !cells[y][x].reserved && cells[y][x].target === b.color);
    if (idx < 0) continue;
    const [x, y] = holes.splice(idx, 1)[0];
    cells[y][x].reserved = true;
    b.state = 'toBoard'; b.cx = x; b.cy = y;
    sent++;
  }
}

function checkEnd() {
  if (state !== 'play') return;
  if (beads.some(b => b.state !== 'tray' || b.delay > 0)) return;
  let done = true;
  for (const row of cells) for (const c of row) if (c.cur !== c.target) { done = false; break; }
  if (done && !beads.length) {
    state = 'win';
    const lastLv = level === LEVELS.length - 1, lv = level;
    burst();
    setTimeout(() => state === 'win' && level === lv && showOverlay('完成！', `「${LEVELS[level].name}」がきれいに並んだ！<br>${moves} 手でクリア`,
      lastLv ? [['最初から', () => loadLevel(0), true]] : [['次のレベル', () => loadLevel(level + 1), true]]), 700);
    return;
  }
  const stuck = trayCount() >= TRAY_SIZE &&
    !beads.some(b => holes.some(([x, y]) => cells[y][x].target === b.color));
  if (stuck) {
    state = 'lose';
    setTimeout(() => state === 'lose' && showOverlay('トレイが満杯…',
      '入れる場所のないビーズでトレイが埋まってしまった。<br>行き先のある色から外すのがコツ！',
      [['やり直す', () => loadLevel(level), true]]), 400);
  }
}
function burst() {
  const { bx, by, cell } = layout;
  for (let i = 0; i < 80; i++) {
    const x = rnd(W), y = rnd(H);
    particles.push({ x: bx + x * cell + cell / 2, y: by + y * cell + cell / 2,
      vx: (Math.random() - .5) * 300, vy: -Math.random() * 380, life: 1, color: cells[y][x].target });
  }
}

// ---------- Loop ----------
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  update(dt); draw(now / 1000);
  requestAnimationFrame(frame);
}
function update(dt) {
  const { slot, bx, by, cell } = layout;
  const k = Math.min(1, dt * 10);
  sortedTray().forEach((b, i) => {
    if (b.delay > 0) { b.delay -= dt; return; }
    const p = slotPos(i);
    b.x += (p.x - b.x) * k; b.y += (p.y - b.y) * k; b.size += (slot - b.size) * k;
    if (b.state === 'toTray' && Math.abs(p.x - b.x) < 1 && Math.abs(p.y - b.y) < 1) b.state = 'tray';
  });
  for (const b of beads) {
    if (b.state !== 'toBoard') continue;
    const tx = bx + b.cx * cell, ty = by + b.cy * cell;
    const kk = Math.min(1, dt * 12);
    b.x += (tx - b.x) * kk; b.y += (ty - b.y) * kk; b.size += (cell - b.size) * kk;
    if (Math.abs(tx - b.x) < 1 && Math.abs(ty - b.y) < 1) {
      const c = cells[b.cy][b.cx];
      c.cur = b.color; c.reserved = false;
      b.done = true;
      for (let i = 0; i < 3; i++) particles.push({ x: tx + cell / 2, y: ty + cell / 2,
        vx: (Math.random() - .5) * 120, vy: (Math.random() - .5) * 120, life: 0.35, color: '#ffffff' });
    }
  }
  if (beads.some(b => b.done)) { beads = beads.filter(b => !b.done); updateHud(); }
  dispatch();
  particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt; });
  particles = particles.filter(p => p.life > 0);
  shakes.forEach(s => s.t += dt); shakes = shakes.filter(s => s.t < 0.35);
  if (hintT > 0) hintT -= dt;
  checkEnd();
}

function draw(t) {
  ctx.clearRect(0, 0, VW, VH);
  ctx.fillStyle = '#d6cdee'; ctx.fillRect(0, 0, VW, VH);
  const { bx, by, cell, boardW, boardH, tx, ty, trayW, trayH, trayPad, slot } = layout;

  // board
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  rr(ctx, bx - 6, by - 6, boardW + 12, boardH + 12, 10); ctx.fill();
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = cells[y][x];
    const px = bx + x * cell, py = by + y * cell;
    if (c.cur) {
      let dx = 0;
      const s = shakes.find(s => s.x === x && s.y === y);
      if (s) dx = Math.sin(s.t * 60) * cell * 0.15 * (1 - s.t / 0.35);
      ctx.drawImage(beadSprite(c.cur, cell), px + dx, py, cell, cell);
      if (hintT > 0 && c.cur !== c.target) {
        ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 12);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1.5, cell * 0.12);
        rr(ctx, px + 1, py + 1, cell - 2, cell - 2, cell * 0.3); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    } else {
      // empty socket that shows which color belongs here
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      rr(ctx, px + cell * 0.1, py + cell * 0.1, cell * 0.8, cell * 0.8, cell * 0.25); ctx.fill();
      ctx.globalAlpha = 0.45; ctx.fillStyle = c.target;
      ctx.beginPath(); ctx.arc(px + cell / 2, py + cell / 2, cell * 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // tray
  ctx.fillStyle = '#fffdf4';
  ctx.shadowColor = 'rgba(80,60,140,.25)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 4;
  rr(ctx, tx - trayPad, ty - trayPad, trayW + trayPad * 2, trayH + trayPad * 2, 22); ctx.fill();
  ctx.shadowColor = 'transparent';
  for (let i = 0; i < TRAY_SIZE; i++) {
    const p = slotPos(i);
    ctx.fillStyle = '#ece6d8';
    rr(ctx, p.x + slot * 0.1, p.y + slot * 0.1, slot * 0.8, slot * 0.8, slot * 0.25); ctx.fill();
    ctx.strokeStyle = '#d8c3a0'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  const n = trayCount(), ratio = n / TRAY_SIZE;
  ctx.fillStyle = ratio > 0.8 ? '#e8364a' : ratio > 0.6 ? '#ff8a1f' : '#7a5cff';
  ctx.font = '700 12px system-ui, sans-serif'; ctx.textAlign = 'right';
  ctx.fillText(`トレイ ${n} / ${TRAY_SIZE}`, tx + trayW + trayPad - 4, ty - trayPad - 6);

  // beads: resting ones first, flying ones on top
  for (const b of beads) if (b.state === 'tray') ctx.drawImage(beadSprite(b.color, slot), b.x, b.y, b.size, b.size);
  for (const b of beads) if (b.state !== 'tray') ctx.drawImage(beadSprite(b.color, Math.max(cell, slot)), b.x, b.y, b.size, b.size);

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.6)); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---------- UI ----------
cv.addEventListener('pointerdown', e => tap(e.clientX, e.clientY));
document.getElementById('restartBtn').onclick = () => loadLevel(level);
document.getElementById('hintBtn').onclick = () => { if (state === 'play') hintT = 1.6; };
document.getElementById('helpBtn').onclick = showHelp;

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}
function showOverlay(title, text, buttons) {
  document.getElementById('ovTitle').textContent = title;
  document.getElementById('ovText').innerHTML = text;
  const row = document.getElementById('ovButtons'); row.innerHTML = '';
  for (const [label, fn, primary] of buttons) {
    const b = document.createElement('button');
    b.className = 'btn' + (primary ? ' primary' : ''); b.textContent = label;
    b.onclick = fn; row.appendChild(b);
  }
  document.getElementById('overlay').classList.add('show');
}
function hideOverlay() { document.getElementById('overlay').classList.remove('show'); }
function showHelp() {
  const prev = state;
  if (state === 'play') state = 'pause';
  showOverlay('あそびかた',
    '絵の中に<b>まちがった色のビーズ</b>がまざっています。<br>' +
    'タップすると、つながった同じ色のビーズがトレイへ移動。空いたマスには、トレイから<b>正しい色のビーズ</b>が自動で飛んでいきます。<br>' +
    'トレイ(60マス)が行き場のないビーズで満杯になる前に、絵を完成させよう！',
    [['OK', () => { hideOverlay(); state = prev; }, true]]);
}

loadLevel(level);
requestAnimationFrame(frame);
try { if (!localStorage.getItem('pb_seen_help2')) { localStorage.setItem('pb_seen_help2', '1'); showHelp(); } }
catch (e) { showHelp(); }
</script>
