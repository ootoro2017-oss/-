<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ホール経営物語</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap">
<style>
  /* Layout: one-screen app. Status bar on top, scrolling tab content, tab bar at bottom. Neon-hall look, dark only by design. */
  :root {
    --bg: #130c22;
    --panel: #1f1535;
    --panel2: #2a1d47;
    --line: #3d2c63;
    --text: #f5f0ff;
    --muted: #a99bc9;
    --gold: #ffcf3a;
    --pink: #ff4fa3;
    --cyan: #3fe0ff;
    --good: #4ade80;
    --bad: #ff5d6c;
    --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 14px;
    display: flex; flex-direction: column; overflow: hidden; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }

  /* status bar */
  #status { padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
    background: linear-gradient(180deg, #2a1650, var(--bg)); border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  .row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  #shopName { font-family: var(--display); font-size: 18px; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 0 12px rgba(255,207,58,.45); min-width: 0; }
  #rank { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .row2 { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #date { font-weight: 700; }
  .badge { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; letter-spacing: .04em; }
  .badge.big { background: var(--pink); color: #fff; box-shadow: 0 0 10px var(--pink); }
  .badge.small { background: var(--cyan); color: #04202a; }
  #money { font-family: var(--display); font-size: 20px; margin-left: auto; }
  #money.neg { color: var(--bad); }
  .row3 { display: flex; gap: 8px; align-items: center; }
  .meter { flex: 1; display: grid; gap: 3px; min-width: 0; }
  .meter label { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
  .bar { height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 99px; transition: width .4s; }
  .ctrl { display: flex; gap: 6px; }
  .cbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 10px; font-weight: 700; white-space: nowrap; }
  .cbtn.on { background: var(--pink); border-color: var(--pink); color: #fff; }
  .cbtn.go { background: var(--gold); border-color: var(--gold); color: #2a1a00; }

  main { flex: 1; overflow-y: auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
    display: grid; gap: 12px; align-content: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
  .card h3 { margin: 0; font-size: 13px; letter-spacing: .06em; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--panel2); border-radius: 10px; padding: 8px; min-width: 0; }
  .stat small { display: block; color: var(--muted); font-size: 11px; }
  .stat b { font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pos { color: var(--good); } .negc { color: var(--bad); }
  .muted { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 0; }

  /* floor */
  #floor { display: grid; grid-template-columns: repeat(auto-fill, minmax(16px, 1fr)); gap: 3px; }
  .m { aspect-ratio: 3 / 4; border-radius: 3px; position: relative; max-width: 100%; }
  .m.slot { background: var(--cyan); }
  .m.pachi { background: var(--pink); }
  .m.hot::after { content: ""; position: absolute; inset: -2px; border-radius: 4px; box-shadow: 0 0 6px 1px var(--gold); }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 12px; border-radius: 2px; margin-right: 4px; vertical-align: -2px; background: var(--c); }

  .chart { width: 100%; height: 110px; display: block; }
  .news { display: grid; gap: 6px; max-height: 180px; overflow-y: auto; font-size: 12px; }
  .news div { color: var(--muted); } .news b { color: var(--text); font-weight: 600; }

  /* settings */
  .model { display: grid; gap: 8px; }
  .mhead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .mname { font-weight: 800; font-size: 15px; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 99px; margin-left: 6px; font-weight: 700; vertical-align: 2px; }
  .tag.slot { background: rgba(63,224,255,.18); color: var(--cyan); }
  .tag.pachi { background: rgba(255,79,163,.18); color: var(--pink); }
  .tag.new { background: var(--gold); color: #2a1a00; }
  .chips { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .chips > span { font-size: 11px; color: var(--muted); width: 52px; }
  .chip { border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; width: 34px; height: 32px; font-weight: 800; }
  .chip.on { background: var(--gold); border-color: var(--gold); color: #2a1a00; }
  .chip.ev.on { background: var(--pink); border-color: var(--pink); color: #fff; }
  details summary { color: var(--muted); font-size: 12px; cursor: pointer; }
  .units { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; margin-top: 8px; }
  .unit { background: var(--panel2); border-radius: 8px; padding: 6px 8px; display: flex; gap: 6px; align-items: center; font-size: 12px; }
  .unit select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px; }

  /* calendar */
  .calhead { display: flex; align-items: center; justify-content: space-between; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .dow { text-align: center; font-size: 11px; color: var(--muted); }
  .cal button { aspect-ratio: 1; border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 2px; font-weight: 700;
    display: grid; place-items: center; font-size: 13px; position: relative; max-width: 100%; min-width: 0; }
  .cal button small { font-size: 9px; font-weight: 800; line-height: 1; }
  .cal button.past { opacity: .35; }
  .cal button.today { outline: 2px solid var(--gold); }
  .cal button.ev1 { background: rgba(63,224,255,.22); border-color: var(--cyan); }
  .cal button.ev2 { background: rgba(255,79,163,.3); border-color: var(--pink); }
  .cal button.empty { visibility: hidden; }
  .cal button.rv::after { content: ""; position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--bad); }
  .badge.rival { background: var(--bad); color: #fff; }
  #wx { font-size: 12px; color: var(--muted); }
  select.full { width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }

  /* shop & management */
  .item { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; }
  .item .info { min-width: 0; display: grid; gap: 2px; }
  .item .info small { color: var(--muted); font-size: 11px; }
  .btns { display: flex; gap: 6px; flex-shrink: 0; }
  .btn { border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 800; background: var(--gold); color: #2a1a00; white-space: nowrap; }
  .btn.sub { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  .btn:disabled { opacity: .35; cursor: default; }
  input.name { width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }

  /* tabs */
  nav { display: grid; grid-template-columns: repeat(6, 1fr); border-top: 1px solid var(--line); background: var(--panel);
    padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  nav button { background: none; border: 0; padding: 10px 0 12px; font-size: 11px; font-weight: 700; color: var(--muted); display: grid; justify-items: center; gap: 2px; }
  nav button i { font-style: normal; font-size: 18px; line-height: 1; }
  nav button.on { color: var(--gold); }

  #toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 120px); transform: translate(-50%, -6px); background: var(--panel2);
    border: 1px solid var(--gold); color: var(--text); padding: 8px 14px; border-radius: 12px; font-size: 13px; opacity: 0;
    transition: opacity .25s, transform .25s; pointer-events: none; z-index: 5; max-width: calc(100% - 32px); text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #over[hidden] { display: none; }
  #over { position: fixed; inset: 0; background: rgba(8,4,16,.7); display: grid; place-items: center; padding: 16px; z-index: 6; }
  #over .card { max-width: 360px; width: 100%; text-align: center; }
  #over h2 { margin: 0; font-family: var(--display); font-weight: 400; color: var(--gold); font-size: 24px; }
  /* farm */
  .plots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .plot { aspect-ratio: 1; border-radius: 10px; border: 1px solid #5a3d22; background: #3a2614; display: grid; place-items: center;
    align-content: center; gap: 2px; position: relative; overflow: hidden; padding: 0; max-width: 100%; min-width: 0; }
  .plot span { font-size: 24px; line-height: 1; }
  .plot small { font-size: 10px; color: var(--muted); }
  .plot i { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--good); }
  .plot.empty { background: transparent; border-style: dashed; }
  .plot.empty span { font-size: 18px; color: var(--muted); }
  .plot.ready { border-color: var(--gold); box-shadow: 0 0 8px rgba(255,207,58,.5) inset; }
  .plot.ready small { color: var(--gold); font-weight: 800; }
  .plot .soil { position: absolute; top: 3px; left: 4px; font-size: 9px; font-style: normal; font-weight: 800; color: #c9a67a; }
  .plot.soilmode { border-color: #c9a67a; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header id="status">
  <div class="row1"><div id="shopName"></div><div id="rank"></div></div>
  <div class="row2"><span id="date"></span><span id="wx"></span><span id="evBadge"></span><span id="money" class="num"></span></div>
  <div class="row3">
    <div class="meter"><label><span>評判</span><span id="repV" class="num"></span></label><div class="bar"><i id="repBar" style="background:var(--gold)"></i></div></div>
    <div class="meter"><label><span>イベ信頼度</span><span id="trustV" class="num"></span></label><div class="bar"><i id="trustBar" style="background:var(--pink)"></i></div></div>
    <div class="ctrl">
      <button class="cbtn" id="autoBtn">▶ 自動</button>
      <button class="cbtn go" id="nextBtn">翌日へ</button>
    </div>
  </div>
</header>
<main id="main"></main>
<nav id="tabs"></nav>
<div id="toast"></div>
<div id="over" hidden></div>

<script>
// ---------- Data ----------
const START = new Date(2026, 3, 1); // game starts 2026-04-01
const DOW = ['日', '月', '火', '水', '木', '金', '土'];
// payout rate by setting 1..6
const RATE = { slot: [0.94, 0.97, 1.00, 1.03, 1.06, 1.10], pachi: [0.92, 0.95, 0.98, 1.01, 1.04, 1.07] };
const COIN_IN = { slot: 300000, pachi: 260000 }; // yen played per machine per fully-occupied day
const MODELS = [
  { id: 'k7',     name: 'キラキラセブン',     kind: 'slot',  cat: 'Aタイプ', price: 150000, pop: 1.00, vol: 0.05, release: -999 },
  { id: 'neon',   name: 'ネオンBAR',          kind: 'slot',  cat: 'Aタイプ', price: 130000, pop: 0.85, vol: 0.05, release: -999 },
  { id: 'drg',    name: 'ドラゴンラッシュ',   kind: 'slot',  cat: 'AT機',    price: 210000, pop: 1.10, vol: 0.13, release: -999 },
  { id: 'marine', name: 'マリンパラダイス',   kind: 'pachi', cat: '甘デジ',  price: 140000, pop: 1.00, vol: 0.06, release: -999 },
  { id: 'samu',   name: '侍ブレイズ',         kind: 'pachi', cat: 'ミドル',  price: 190000, pop: 1.08, vol: 0.11, release: -999 },
  { id: 'neko',   name: 'ねこまつり',         kind: 'pachi', cat: '甘デジ',  price: 180000, pop: 1.25, vol: 0.06, release: 14 },
  { id: 'space',  name: '銀河大戦MAX',        kind: 'pachi', cat: 'ミドル',  price: 260000, pop: 1.40, vol: 0.15, release: 40 },
  { id: 'sakura', name: 'サクラ吹雪',         kind: 'slot',  cat: 'AT機',    price: 275000, pop: 1.45, vol: 0.14, release: 70 },
  { id: 'gold',   name: '黄金の招き猫',       kind: 'slot',  cat: 'Aタイプ', price: 225000, pop: 1.35, vol: 0.05, release: 100 },
  { id: 'ninja',  name: '忍者ストーム',       kind: 'slot',  cat: 'AT機',    price: 310000, pop: 1.55, vol: 0.15, release: 135 },
  { id: 'marine2',name: 'マリンパラダイス2',  kind: 'pachi', cat: 'ミドル',  price: 300000, pop: 1.55, vol: 0.10, release: 170 },
  { id: 'kaiju',  name: '怪獣大進撃',         kind: 'pachi', cat: 'ミドル',  price: 340000, pop: 1.65, vol: 0.14, release: 220 },
  { id: 'star',   name: 'スターダスト7',      kind: 'slot',  cat: 'Aタイプ', price: 280000, pop: 1.60, vol: 0.05, release: 270 },
];
const MODEL = Object.fromEntries(MODELS.map(m => [m.id, m]));
const LEVELS = [
  { name: '町の小さなホール', seats: 24,  cost: 0,         rent: 10000 },
  { name: '商店街ホール',     seats: 48,  cost: 2000000,   rent: 45000 },
  { name: '駅前店',           seats: 96,  cost: 6000000,  rent: 100000 },
  { name: '郊外大型店',       seats: 180, cost: 18000000,  rent: 200000 },
  { name: 'メガホール',       seats: 320, cost: 45000000,  rent: 380000 },
  { name: '地域一番店',       seats: 500, cost: 110000000, rent: 600000 },
];
const ADS = [
  { name: 'なし',         cost: 0,     mod: 1.00 },
  { name: 'チラシ',       cost: 15000, mod: 1.10 },
  { name: 'SNS広告',      cost: 40000, mod: 1.22 },
  { name: 'テレビCM',     cost: 120000, mod: 1.40 },
];
const RULES = [
  { id: 'none', name: 'なし',                 fn: () => 0 },
  { id: 'd7',   name: '7のつく日（7・17・27日）', fn: d => d.getDate() % 10 === 7 ? 1 : 0 },
  { id: 'd0',   name: '0のつく日（10・20・30日）', fn: d => d.getDate() % 10 === 0 ? 1 : 0 },
  { id: 'zoro', name: 'ゾロ目（月と日が同じ）',   fn: d => d.getDate() === d.getMonth() + 1 ? 2 : 0 },
  { id: 'sat',  name: '毎週土曜',               fn: d => d.getDay() === 6 ? 1 : 0 },
  { id: 'pay',  name: '給料日（25日）',          fn: d => d.getDate() === 25 ? 1 : 0 },
];
const STAFF_WAGE = 10000, UPKEEP = 800, SELL_BACK = 0.2;
const RANKS = [[0, '新人オーナー'], [40, '地元の顔'], [100, '人気ホール経営者'], [200, '業界の注目株'], [350, 'ホール王'], [480, '伝説のオーナー']];

// ---------- State ----------
let G;
function newGame() {
  let id = 1;
  const machines = [];
  const add = (model, n) => { for (let i = 0; i < n; i++) machines.push({ id: id++, model, s: 1, e: 4, seen: RATE[MODEL[model].kind][0], util: 0, pay: 0 }); };
  add('k7', 6); add('neon', 4); add('marine', 6); add('samu', 4);
  return {
    name: 'ホール ラッキー', day: 0, money: 3000000, rep: 45, trust: 30, level: 0,
    staff: 2, ad: 0, rule: 'd7', manual: {}, machines, nextId: id,
    history: [], news: [{ d: 0, t: 'オープンしました！ まずは設定とイベ日を決めよう。' }],
    seenModels: MODELS.filter(m => m.release <= 0).map(m => m.id), over: false, farm: newFarm(),
  };
}
function save() { try { localStorage.setItem('parlor_v1', JSON.stringify(G)); } catch (e) {} }
function load() {
  try { const s = JSON.parse(localStorage.getItem('parlor_v1')); if (s && s.machines) { if (!s.farm) s.farm = newFarm(); return s; } } catch (e) {}
  return null;
}

// ---------- Helpers ----------
const dateOf = d => new Date(START.getFullYear(), START.getMonth(), START.getDate() + d);
const dayIndex = date => Math.round((date - START) / 86400000);
const fmtDate = d => { const x = dateOf(d); return `${x.getMonth() + 1}月${x.getDate()}日(${DOW[x.getDay()]})`; };
const yen = v => (v < 0 ? '−' : '') + '¥' + Math.abs(Math.round(v)).toLocaleString('ja-JP');
const man = v => { const a = Math.abs(v); const s = v < 0 ? '−' : ''; return a >= 1e8 ? `${s}${(a / 1e8).toFixed(2)}億円` : `${s}${Math.round(a / 1e4).toLocaleString('ja-JP')}万円`; };
const pct = v => (v * 100).toFixed(1) + '%';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = n => Math.floor(Math.random() * n);
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const seats = () => LEVELS[G.level].seats;
const staffNeed = () => Math.max(1, Math.ceil(G.machines.length / 15));
function eventOf(d) {
  if (G.manual[d] !== undefined) return G.manual[d];
  return RULES.find(r => r.id === G.rule).fn(dateOf(d));
}
function popNow(m, d) {
  const age = d - Math.max(m.release, -60);
  return m.pop * (1 + 0.5 * Math.exp(-age / 30)) * Math.max(0.55, 1 - age / 700);
}
function available() { return MODELS.filter(m => m.release <= G.day); }
function rankName() { let r = RANKS[0][1]; for (const [n, t] of RANKS) if (G.machines.length >= n) r = t; return r; }

// ---------- Simulation ----------
function advanceDay() {
  if (G.over) return;
  autoStaff(G.day);
  const d = G.day, date = dateOf(d), ev = eventOf(d);
  const M = G.machines.length;
  let dayMod = [1.2, 0.9, 0.9, 0.95, 0.95, 1.08, 1.3][date.getDay()];
  if (date.getDate() === 25) dayMod *= 1.2;
  const rain = G.weather === 'rain';
  dayMod *= wx().hall;
  if (G.writerDay === d) dayMod *= 1.5;
  const evMod = ev ? (1 + (ev === 2 ? 1.0 : 0.5) * G.trust / 100) * (1 + G.farm.hallBoost) : 1;
  if (ev) G.farm.hallBoost = 0;
  // the rival steals customers on its event days; on a shared event day the stronger hall wins
  const rev = rivalEventOf(d);
  let rivalMod = 1;
  if (rev) {
    const theirs = G.rival.power * (rev === 2 ? 1.3 : 1);
    const mine = ev ? (G.rep + G.trust) / 2 * (ev === 2 ? 1.3 : 1) : 0;
    rivalMod = ev ? clamp(0.85 + (mine - theirs) / 100, 0.6, 1.25) : clamp(1 - theirs / 250 - (rev === 2 ? 0.1 : 0), 0.5, 0.95);
  }
  const popAvg = M ? G.machines.reduce((a, m) => a + popNow(MODEL[m.model], d), 0) / M : 1;
  const visitors = Math.round(M * 2.2 * (0.05 + G.rep / 100 * 1.6) * Math.sqrt(popAvg) * dayMod * evMod * ADS[G.ad].mod * rivalMod * (0.92 + Math.random() * 0.16));
  // players stay longer at a hall where machines have been paying out
  const seenAvg = M ? G.machines.reduce((a, m) => a + m.seen, 0) / M : 1;
  let demand = Math.min(M, visitors * 0.55 * clamp(1 + (seenAvg - 1) * 5, 0.5, 1.4));

  // customers pick machines by popularity and how loose the machine has looked lately
  const w = G.machines.map(m => m.broken ? 0 : popNow(MODEL[m.model], d) * Math.exp(7 * (m.seen - 1)));
  const util = G.machines.map(() => 0);
  let left = demand;
  for (let pass = 0; pass < 4 && left > 0.01; pass++) {
    let sw = 0; G.machines.forEach((m, i) => { if (util[i] < 1) sw += w[i]; });
    if (!sw) break;
    let used = 0;
    G.machines.forEach((m, i) => {
      if (util[i] >= 1) return;
      const add = Math.min(1 - util[i], left * w[i] / sw);
      util[i] += add; used += add;
    });
    left -= used;
  }

  let sales = 0, out = 0, best = null;
  G.machines.forEach((m, i) => {
    const mod = MODEL[m.model];
    const setting = ev ? m.e : m.s;
    const u = util[i];
    const pay = Math.max(0.2, RATE[mod.kind][setting - 1] + gauss() * mod.vol / Math.sqrt(Math.max(u, 0.15)) * 0.6);
    const inn = u * COIN_IN[mod.kind];
    sales += inn; out += inn * pay;
    m.util = u; m.pay = pay;
    if (u > 0.05) m.seen = m.seen * 0.75 + pay * 0.25;
    if (!best || inn * (pay - 1) > best.v) best = { v: inn * (pay - 1), m };
  });
  const gross = sales - out;
  const costs = LEVELS[G.level].rent + G.staff * STAFF_WAGE + M * UPKEEP + ADS[G.ad].cost;
  const net = gross - costs;
  G.money += net;

  const avgPay = sales ? out / sales : 1;
  const need = staffNeed();
  const staffAdj = G.staff < need ? -25 * (need - G.staff) / need : Math.min(6, (G.staff - need) * 2);
  const target = clamp(55 + (avgPay - 1) * 600 + staffAdj, 3, 99);
  const repBefore = G.rep;
  G.rep = clamp(G.rep + (target - G.rep) * 0.12, 0, 100);
  if (ev) {
    const before = G.trust;
    G.trust = clamp(G.trust + clamp((avgPay - 1.02) * 400, -15, 12), 0, 100);
    if (avgPay < 1.0) note(`${ev === 2 ? '特日' : 'イベ日'}なのに出ていないと噂に… 信頼度 ${Math.round(before)}→${Math.round(G.trust)}`);
    else if (avgPay > 1.04) note(`${ev === 2 ? '特日' : 'イベ日'}が大盛況！ 出率 ${pct(avgPay)}、信頼度アップ`);
  }
  if (G.staff < need) note(`スタッフ不足（必要 ${need}人）で接客が回らず評判ダウン`);

  G.money += farmDay(d);
  const farmNet = G.farm.today.net;
  G.history.push({ d, visitors, sales, gross, net, avgPay, ev, rain, best: best && best.m.id, farmNet, wx: G.weather, rev });
  if (G.history.length > 60) G.history.shift();
  afterDay(d, G.history[G.history.length - 1]);
  G.day++;

  for (const m of MODELS) if (m.release > 0 && m.release <= G.day && !G.seenModels.includes(m.id)) {
    G.seenModels.push(m.id);
    note(`新台「${m.name}」(${m.cat}) が登場！ 台入替から導入できます`);
    toast(`新台「${m.name}」登場！`);
  }
  if (G.money < -3000000) {
    G.over = true; stopAuto();
    showOver('倒産…', `資金が −300万円を下回りました。<br>${G.day}日間の営業、おつかれさまでした。`, [['最初からやり直す', reset]]);
  }
  save();
  render();
  const r = G.history[G.history.length - 1];
  toast(`${fmtDate(d)} ホール ${man(r.net)} / 農園 ${man(r.farmNet)}`);
}
function note(t) { G.news.unshift({ d: G.day, t }); if (G.news.length > 40) G.news.pop(); }

function chart() {
  const hs = G.history.slice(-30);
  if (!hs.length) return '<p class="muted">営業すると、ここに毎日の収支が並びます。</p>';
  const W = 300, H = 110, pad = 14;
  const max = Math.max(1, ...hs.map(h => Math.abs(h.net)));
  const zero = H / 2;
  const bw = (W - pad) / 30;
  const bars = hs.map((h, i) => {
    const hgt = Math.abs(h.net) / max * (H / 2 - 12);
    const y = h.net >= 0 ? zero - hgt : zero;
    return `<rect x="${pad + i * bw + 1}" y="${y.toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${Math.max(1, hgt).toFixed(1)}" rx="1.5" fill="${h.net >= 0 ? 'var(--good)' : 'var(--bad)'}"${h.ev ? ' stroke="var(--pink)" stroke-width="1"' : ''}/>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="${pad}" x2="${W}" y1="${zero}" y2="${zero}" stroke="var(--line)"/>
    ${bars}
    <text x="0" y="10" font-size="8" fill="var(--muted)">+${man(max)}</text>
    <text x="0" y="${H - 2}" font-size="8" fill="var(--muted)">−${man(max)}</text>
  </svg><p class="muted">ピンク枠はイベ日。</p>`;
}

  { id: 'matsuri', name: '収穫祭',         cost: 200000, lead: 5, desc: '参加費 ¥2,500/人＋在庫販売。大集客の目玉イベント' },
];
const POSTS = [
  { id: 'field',  name: '畑の様子',         desc: 'フォロワーが少し増える' },
  { id: 'harvest',name: '収穫報告',         desc: '在庫があると、翌日のECの注文が増える' },
  { id: 'recipe', name: 'レシピ紹介',       desc: 'フォロワーが増えやすい' },
  { id: 'event',  name: 'イベント告知',     desc: '予定中の農園イベントの参加者が増える' },
  { id: 'hall',   name: 'ホールのイベ日告知', desc: '次のイベ日・特日の来店が増える' },
];

function newFarm() {
  return {
    plots: [null, null, null, null], hands: 1, stock: [], followers: 50,
    ec: false, rating: 3.5, priceLv: { spin: 1, tomato: 1, imo: 1, ichigo: 1, melon: 1, rice: 1 },
    posted: -1, lastPost: 0, postBoost: 0, eventBoost: 0, hallBoost: 0,
    events: [], seed: 'spin', view: 'field', log: [],
  };
}
const F = () => G.farm;
const monthOf = d => dateOf(d).getMonth() + 1;
const inSeason = (c, d) => c.season.includes(monthOf(d));
const stockOf = id => F().stock.filter(s => s.crop === id).reduce((a, s) => a + s.qty, 0);
const hasFac = id => !!(F().fac && F().fac[id]);
const handsNeed = () => Math.max(1, Math.ceil(F().plots.length / (PLOTS_PER_HAND * (hasFac('tractor') ? 2 : 1))));
const freshDays = c => c.fresh * (hasFac('cold') ? 2 : 1);
const plotCap = () => FARM_LV[F().lv].plots;
const cropOpen = c => F().lv >= CROP_LV[c.id];
const ecPrice = id => Math.round(CROP[id].price * PRICE_LV[F().priceLv[id]].mult);

// take units of a crop from the oldest batches first
function takeStock(id, want) {
  let got = 0;
  for (const s of F().stock) {
    if (s.crop !== id || got >= want) continue;
    const t = Math.min(s.qty, want - got);
    s.qty -= t; got += t;
  }
  F().stock = F().stock.filter(s => s.qty > 0);
  return got;
}
function sellAllStock(mult, cap) {
  let rev = 0, units = 0;
  for (const c of CROPS) {
    const n = takeStock(c.id, Math.max(0, cap - units));
    units += n; rev += n * c.price * mult;
  }
  return { rev, units };
}
function farmNote(t) { F().log.unshift({ d: G.day, t }); if (F().log.length > 30) F().log.pop(); }

// one day of farm business; returns net yen
function farmDay(d) {
  const f = F();
  let income = 0, cost = f.hands * HAND_WAGE;
  const speed = (f.hands >= handsNeed() ? 1 : 0.6) * wx().grow * (hasFac('water') ? 1.25 : 1);
  for (const p of f.plots) if (p && p.prog < CROP[p.crop].grow) p.prog = Math.min(CROP[p.crop].grow, p.prog + speed);
  for (const p of f.plots) if (p && p.prog >= CROP[p.crop].grow) p.ripe = (p.ripe || 0) + 1;

  // spoilage
  const before = f.stock.length;
  f.stock = f.stock.filter(s => d - s.day <= freshDays(CROP[s.crop]));
  if (f.stock.length < before) farmNote('鮮度が落ちた在庫を廃棄しました');

  // EC orders
  let orders = 0, ecRev = 0, missed = 0;
  if (f.ec) {
    const dow = dateOf(d).getDay();
    const base = (3 + 25 * Math.log10(1 + f.followers / 300)) * (f.rating / 3.5) * (dow === 0 || dow === 6 ? 1.2 : 1) * (1 + f.postBoost) * (0.8 + Math.random() * 0.4);
    const n = Math.round(base);
    for (let i = 0; i < n; i++) {
      const wts = CROPS.map(c => cropOpen(c) ? (2.2 - PRICE_LV[f.priceLv[c.id]].mult) ** 2 * (inSeason(c, d) ? 1.4 : 1) : 0);
      let r = Math.random() * wts.reduce((a, b) => a + b, 0), c = CROPS[0];
      for (let k = 0; k < CROPS.length; k++) { r -= wts[k]; if (r <= 0) { c = CROPS[k]; break; } }
      const qty = Math.max(1, Math.round((3000 / c.price) * (0.6 + Math.random() * 0.8)));
      if (stockOf(c.id) >= qty) { takeStock(c.id, qty); orders++; ecRev += qty * ecPrice(c.id) - SHIP_COST; }
      else missed++;
    }
    const tgt = orders ? 4.6 - missed / (orders + missed) * 2.5 : f.rating - 0.05;
    f.rating = clamp(f.rating + (tgt - f.rating) * 0.08, 1, 5);
    income += ecRev;
  }
  f.postBoost = 0;

  // scheduled farm events
  for (const e of f.events.filter(e => e.day === d)) {
    const def = FARM_EVENTS.find(x => x.id === e.type);
    const boost = 1 + f.eventBoost;
    let rev = 0, people = 0, gain = 0;
    if (e.type === 'marche') {
      const s = sellAllStock(1.3, Math.round((60 + f.followers / 15) * boost));
      rev = s.rev; gain = Math.round(15 + Math.random() * 40 * boost);
      farmNote(`マルシェで ${s.units}点 売れました（${man(rev)}）`);
    } else if (e.type === 'taiken') {
      people = Math.round((15 + f.followers / 40) * boost * (0.8 + Math.random() * 0.4));
      rev = people * 1500; gain = Math.round(people * 1.2);
      farmNote(`収穫体験に ${people}人 参加（${man(rev)}）`);
    } else {
      people = Math.round((60 + f.followers / 12) * boost * (0.8 + Math.random() * 0.4));
      const s = sellAllStock(1.2, people * 2);
      rev = people * 2500 + s.rev; gain = Math.round(people * 0.8);
      farmNote(`収穫祭に ${people}人 来場！ 在庫も ${s.units}点 完売（${man(rev)}）`);
      toast(`収穫祭に ${people}人 来場！`);
    }
    f.followers += gain;
    income += rev * (hired('eventer') ? 1.2 : 1);
    note(`農園：${def.name} 開催（フォロワー +${gain}）`);
  }
  if (f.events.some(e => e.day === d)) f.eventBoost = 0;
  f.events = f.events.filter(e => e.day > d);

  // followers drift down without posts
  if (d - f.lastPost > 3) f.followers = Math.max(20, Math.round(f.followers * 0.99));

  const net = income - cost;
  // JA shipments were paid out when shipped; count them in the day's farm result
  f.today = { orders, ecRev, missed, net: net + (f.shipped || 0) };
  f.shipped = 0;
  return net;
}

function farmAction(a, b) {
  const f = F();
  if (a === 'f-view') { f.view = b.dataset.v; return; }
  if (a === 'f-seed') { if (cropOpen(CROP[b.dataset.v])) f.seed = b.dataset.v; else toast(`${FARM_LV[CROP_LV[b.dataset.v]].name}で解放されます`); return; }
  if (a === 'f-mode') { f.mode = b.dataset.v; return; }
  if (a === 'f-lv') {
    const nl = FARM_LV[f.lv + 1];
    if (!nl || G.money < nl.cost) return;
    G.money -= nl.cost; f.lv++;
    const opened = CROPS.filter(c => CROP_LV[c.id] === f.lv).map(c => c.name);
    note(`農園が「${nl.name}」にランクアップ！${opened.length ? ` ${opened.join('・')}が植えられるように` : ''}`);
    toast(`農園が「${nl.name}」に！`); return;
  }
  if (a === 'f-fac') {
    const fc = FACILITIES.find(x => x.id === b.dataset.v);
    if (hasFac(fc.id) || f.lv < fc.minLv || G.money < fc.cost) return;
    G.money -= fc.cost; f.fac[fc.id] = true; toast(`${fc.name}を導入しました`); return;
  }
  if (a === 'f-plot') {
    const i = +b.dataset.i, p = f.plots[i], c = CROP[f.seed];
    if (f.mode === 'soil') {
      const lv = f.soil[i] || 1, cost = SOIL_COST * lv;
      if (lv >= SOIL_MAX) return toast('この区画の土は最高レベルです');
      if (G.money < cost) return toast(`土づくりには ${man(cost)} 必要です`);
      G.money -= cost; f.soil[i] = lv + 1;
      toast(`${i + 1}番の区画が 土Lv${lv + 1} に（収穫量 +${lv * 10}%）`); return;
    }
    if (!p) {
      if (G.money < c.seed) return toast('お金が足りません');
      G.money -= c.seed;
      f.plots[i] = { crop: c.id, prog: 0, ripe: 0, season: inSeason(c, G.day) };
    } else if (p.prog >= CROP[p.crop].grow) harvest(i);
    else toast(`${CROP[p.crop].name}：収穫まであと${Math.ceil(CROP[p.crop].grow - p.prog)}日`);
    return;
  }
  if (a === 'f-harvestAll') { let n = 0; f.plots.forEach((p, i) => { if (p && p.prog >= CROP[p.crop].grow) { harvest(i, true); n++; } }); toast(n ? `${n}区画を収穫しました` : '収穫できる畑はありません'); return; }
  if (a === 'f-buyPlot') {
    if (f.plots.length >= plotCap() || G.money < PLOT_PRICE) return;
    G.money -= PLOT_PRICE; f.plots.push(null); f.soil.push(1); toast('畑を1区画広げました'); return;
  }
  if (a === 'f-hand') { f.hands = Math.max(1, f.hands + +b.dataset.v); return; }
  if (a === 'f-whole') {
    const c = CROP[b.dataset.v], n = takeStock(c.id, Infinity);
    const rev = n * c.price * WHOLESALE; G.money += rev; f.shipped = (f.shipped || 0) + rev;
    toast(`${c.name} ${n}${c.unit} を出荷：${yen(rev)}`); return;
  }
  if (a === 'f-ecOpen') {
    if (G.money < EC_OPEN) return;
    G.money -= EC_OPEN; f.ec = true; farmNote('ネットショップをオープン！'); toast('ネットショップをオープン！'); return;
  }
  if (a === 'f-price') { f.priceLv[b.dataset.v] = (f.priceLv[b.dataset.v] + 1) % PRICE_LV.length; return; }
  if (a === 'f-post') { post(b.dataset.v); return; }
  if (a === 'f-event') {
    const def = FARM_EVENTS.find(x => x.id === b.dataset.v);
    if (G.money < def.cost || f.events.some(e => e.type === def.id)) return;
    G.money -= def.cost; f.events.push({ type: def.id, day: G.day + def.lead });
    toast(`${def.name}を${fmtDate(G.day + def.lead)}に開催します`); return;
  }
}
function harvest(i, quiet) {
  const f = F(), p = f.plots[i], c = CROP[p.crop];
  const over = Math.max(0, (p.ripe || 0) - 3); // left too long after ripening
  const soil = 1 + ((f.soil[i] || 1) - 1) * 0.1;
  const qty = Math.round(c.yield * (p.season ? 1.25 : hasFac('house') ? 1 : 0.8) * FARM_LV[f.lv].mult * soil * Math.max(0.3, 1 - over * 0.15) * (0.9 + Math.random() * 0.2));
  f.stock.push({ crop: c.id, qty, day: G.day });
  f.plots[i] = null;
  if (!quiet) toast(`${c.icon} ${c.name} ${qty}${c.unit} 収穫！`);
}
function post(type, auto) {
  const f = F();
  if (f.posted === G.day) return toast('今日はもう投稿しました');
  let gain = 3 + Math.sqrt(f.followers) * 0.25, msg = '';
  if (type === 'field') gain *= 1 + Math.random();
  if (type === 'recipe') gain *= 1.5 + Math.random() * 1.5;
  if (type === 'harvest') {
    if (!f.stock.length) return toast('在庫がないので収穫報告ができません');
    gain *= 1 + Math.random(); f.postBoost = 0.5; msg = '明日のECの注文が増えそう';
  }
  if (type === 'event') {
    if (!f.events.length) return toast('予定中の農園イベントがありません');
    gain *= 1 + Math.random(); f.eventBoost = Math.min(1, f.eventBoost + 0.3); msg = 'イベント参加者が増えそう';
  }
  if (type === 'hall') {
    gain *= 0.5 + Math.random(); f.hallBoost = Math.min(0.6, f.hallBoost + 0.1 + f.followers / 20000); msg = '次のイベ日の来店が増えそう';
  }
  if (hired('sns')) gain *= 1.3;
  const viral = Math.random() < 0.06;
  if (viral) gain *= 6;
  gain = Math.round(gain);
  f.followers += gain; f.posted = G.day; f.lastPost = G.day;
  if (!auto || viral) toast(`${viral ? 'バズった！ ' : ''}フォロワー +${gain}${msg ? '・' + msg : ''}`);
  farmNote(`SNS「${POSTS.find(p => p.id === type).name}」投稿 フォロワー +${gain}${viral ? '（バズ）' : ''}`);
}

function viewFarm() {
  const f = F();
  const seg = [['field', '畑'], ['sell', '在庫・出荷'], ['ec', 'EC'], ['sns', 'SNS・イベント']]
    .map(([v, l]) => `<button class="cbtn ${f.view === v ? 'on' : ''}" data-act="f-view" data-v="${v}">${l}</button>`).join('');
  const t = f.today;
  const head = `<div class="card"><div class="chips" style="gap:6px">${seg}</div>
    <div class="stats">
      <div class="stat"><small>フォロワー</small><b>${f.followers.toLocaleString('ja-JP')}</b></div>

      <div class="stat"><small>前日の農園収支</small><b class="${t && t.net < 0 ? 'negc' : 'pos'}">${t ? man(t.net) : '—'}</b></div>
    </div></div>`;
  return head + ({ field: farmField, sell: farmSell, ec: farmEc, sns: farmSns })[f.view]();
}
function farmField() {
  const f = F(), d = G.day;
  const seeds = CROPS.map(c => cropOpen(c)
    ? `<button class="cbtn ${f.seed === c.id ? 'on' : ''}" data-act="f-seed" data-v="${c.id}">${c.icon}${c.name}${inSeason(c, d) ? '<small style="color:var(--gold)"> 旬</small>' : ''}</button>`
    : `<button class="cbtn" style="opacity:.45" data-act="f-seed" data-v="${c.id}">🔒${c.name}</button>`).join('');
  const sc = CROP[f.seed];
  const plots = f.plots.map((p, i) => {
    const soil = `<em class="soil">土${f.soil[i] || 1}</em>`;
    if (f.mode === 'soil') return `<button class="plot soilmode" data-act="f-plot" data-i="${i}">${soil}<span>${(f.soil[i] || 1) >= SOIL_MAX ? '⭐' : '⛏️'}</span><small>${(f.soil[i] || 1) >= SOIL_MAX ? '最高' : man(SOIL_COST * (f.soil[i] || 1))}</small></button>`;
    if (!p) return `<button class="plot empty" data-act="f-plot" data-i="${i}">${soil}<span>＋</span><small>植える</small></button>`;
    const c = CROP[p.crop], ready = p.prog >= c.grow;
    return `<button class="plot ${ready ? 'ready' : ''}" data-act="f-plot" data-i="${i}">${soil}<span>${ready ? c.icon : '🌱'}</span>
      <small>${ready ? (p.ripe > 3 ? '熟れすぎ！' : '収穫') : `あと${Math.ceil(c.grow - p.prog)}日`}</small>
      <i style="width:${Math.min(100, p.prog / c.grow * 100)}%"></i></button>`;
  }).join('');
  const need = handsNeed();
  return `<div class="card"><h3><span>植える作物</span></h3><div class="chips" style="gap:6px">${seeds}</div>
      <p class="muted">${sc.icon}${sc.name}：種苗代 ${yen(sc.seed)}・${sc.grow}日で収穫・約${sc.yield}${sc.unit}（旬は1.25倍、旬以外は${hasFac('house') ? '1.0' : '0.8'}倍）・定価 ${yen(sc.price)}/${sc.unit}・日持ち ${freshDays(sc)}日</p></div>
    <div class="card"><h3><span>畑 ${f.plots.length}区画</span><button class="btn" data-act="f-harvestAll">まとめて収穫</button></h3>
      <div class="chips" style="gap:6px"><button class="cbtn ${f.mode !== 'soil' ? 'on' : ''}" data-act="f-mode" data-v="plant">🌱 植える・収穫</button><button class="cbtn ${f.mode === 'soil' ? 'on' : ''}" data-act="f-mode" data-v="soil">⛏️ 土づくり</button></div>
      <div class="plots">${plots}</div>
      <p class="muted">${f.mode === 'soil' ? `区画をタップすると土のレベルが上がります（最大Lv${SOIL_MAX}・1レベルごとに収穫量 +10%）。作物を植えたままでも改良できます。` : '空いた畑をタップで植え付け、育った畑をタップで収穫。熟してから3日以上放っておくと収穫量が減ります。'}</p></div>
    ${farmLvCard()}
    <div class="card"><h3>農園の拡大</h3>
      <div class="item"><div class="info"><b>畑を1区画広げる</b><small class="num">${f.plots.length}/${plotCap()}区画${f.plots.length >= plotCap() ? '・ランクアップで上限が増えます' : ''}</small></div>
        <button class="btn" data-act="f-buyPlot" ${f.plots.length >= plotCap() || G.money < PLOT_PRICE ? 'disabled' : ''}>${man(PLOT_PRICE)}</button></div>
      <div class="item"><div class="info"><b>農作業スタッフ ${f.hands}人 / 必要 ${need}人</b><small>日給 ${yen(HAND_WAGE)}・${PLOTS_PER_HAND * (hasFac('tractor') ? 2 : 1)}区画ごとに1人。足りないと育ちが遅くなります</small></div>
        <div class="btns"><button class="btn sub" data-act="f-hand" data-v="-1" ${f.hands <= 1 ? 'disabled' : ''}>−</button><button class="btn" data-act="f-hand" data-v="1">＋</button></div></div>
    </div>`;
}
function farmLvCard() {
  const f = F(), cur = FARM_LV[f.lv], nl = FARM_LV[f.lv + 1];

      ${hasFac(fc.id) ? '<span class="pos">導入済み</span>' : `<button class="btn" data-act="f-fac" data-v="${fc.id}" ${f.lv < fc.minLv || G.money < fc.cost ? 'disabled' : ''}>${man(fc.cost)}</button>`}</div>`).join('');
  return `<div class="card"><h3><span>農園ランク</span><span>Lv${f.lv + 1}「${cur.name}」</span></h3>

        <button class="btn" data-act="f-lv" ${G.money < nl.cost ? 'disabled' : ''}>${man(nl.cost)}</button></div>` : '<p class="muted">最高ランクに到達！</p>'}
    </div>

}
function farmSell() {
  const f = F();

    const n = stockOf(c.id);
    const oldest = f.stock.filter(s => s.crop === c.id).reduce((a, s) => Math.min(a, s.day), Infinity);
    const left = n ? freshDays(c) - (G.day - oldest) : 0;

  return `<div class="card"><h3>在庫</h3>${rows}

    <div class="card"><h3>農園ニュース</h3><div class="news">${f.log.map(n => `<div><b>${fmtDate(n.d)}</b> ${esc(n.t)}</div>`).join('') || '<div>まだありません</div>'}</div></div>`;
}
function farmEc() {
  const f = F();
  if (!f.ec) return `<div class="card"><h3>ネットショップ</h3>
    <p class="muted">自分のネットショップを開くと、フォロワーと評価に応じて毎日注文が入り、在庫から自動で発送されます（送料 ${yen(SHIP_COST)}/件は店負担）。</p>

  const t = f.today || { orders: 0, ecRev: 0, missed: 0 };
  const rows = CROPS.map(c => `<div class="item"><div class="info"><b>${c.icon} ${c.name}</b>
      <small class="num">在庫 ${stockOf(c.id)}${c.unit}・販売価格 ${yen(ecPrice(c.id))}/${c.unit}</small></div>
      <button class="btn ${f.priceLv[c.id] === 2 ? '' : 'sub'}" data-act="f-price" data-v="${c.id}">${PRICE_LV[f.priceLv[c.id]].name}</button></div>`).join('');
  return `<div class="card"><h3>前日のEC</h3><div class="stats">
      <div class="stat"><small>注文</small><b>${t.orders}件</b></div>
      <div class="stat"><small>売上</small><b>${man(t.ecRev)}</b></div>
      <div class="stat"><small>品切れ</small><b class="${t.missed ? 'negc' : ''}">${t.missed}件</b></div></div>
      <p class="muted">品切れが多いと評価が下がり、評価が下がると注文も減ります。旬の作物はよく売れます。</p></div>
    <div class="card"><h3><span>価格設定</span><span>タップで切替</span></h3>${rows}
      <p class="muted">高めにすると1件の売上は増えますが、注文が入りにくくなります。</p></div>`;
}
function farmSns() {
  const f = F();
  const done = f.posted === G.day;
  const posts = POSTS.map(p => `<div class="item"><div class="info"><b>${p.name}</b><small>${p.desc}</small></div>
    <button class="btn" data-act="f-post" data-v="${p.id}" ${done ? 'disabled' : ''}>投稿</button></div>`).join('');
  const evs = FARM_EVENTS.map(e => {
    const sch = f.events.find(x => x.type === e.id);
    return `<div class="item"><div class="info"><b>${e.name}</b><small>${sch ? `${fmtDate(sch.day)} 開催予定` : `${e.desc}・${e.lead}日後に開催`}</small></div>
      <button class="btn" data-act="f-event" data-v="${e.id}" ${sch || G.money < e.cost ? 'disabled' : ''}>${man(e.cost)}</button></div>`;
  }).join('');
  return `<div class="card"><h3><span>SNS投稿（1日1回）</span><span>${done ? '今日は投稿済み' : '未投稿'}</span></h3>${posts}
      <p class="muted">ホールと農園で同じアカウント。3日以上投稿しないとフォロワーが少しずつ減ります。たまにバズります。${f.hallBoost ? `<br>次のイベ日の来店 +${Math.round(f.hallBoost * 100)}%（告知効果）` : ''}</p></div>
    <div class="card"><h3>農園イベント</h3>${evs}
      <p class="muted">開催前に「イベント告知」を投稿すると参加者が増えます。</p></div>`;
}

// ---------- Specialists (automation) ----------
const HIRES = [
  { id: 'setter',  name: '設定士',         wage: 20000, desc: '毎日の台の設定を自動で組む。人気台に高設定を入れて「見せ台」を作るのが上手' },
  { id: 'manager', name: '店長',           wage: 18000, desc: 'ホールのスタッフ数を自動で調整し、故障した台をすぐ修理する' },
  { id: 'sns',     name: 'SNS運用担当',    wage: 15000, desc: '毎日いちばん効く内容を自動で投稿。フォロワーの伸びも1.3倍' },
  { id: 'eventer', name: 'イベントスタッフ', wage: 12000, desc: '農園イベントを自動で企画・開催。イベントの売上が1.2倍' },
  { id: 'farmer',  name: '農場長',         wage: 15000, desc: '旬の作物を自動で植えて収穫し、傷みそうな在庫を出荷する' },
];
const SETTER_MODES = [
  { id: 'take',    name: '回収重視', normal: [1, 0.08, 4], event: [4, 0.20, 5] },
  { id: 'balance', name: 'バランス', normal: [2, 0.12, 4], event: [4, 0.35, 6] },
  { id: 'give',    name: '還元重視', normal: [2, 0.20, 5], event: [4, 0.60, 6] },
];
const WEATHER = {
  sun:     { icon: '☀️', name: '晴れ',  hall: 1.00, grow: 1.0 },
  rain:    { icon: '☔', name: '雨',    hall: 1.08, grow: 1.0 },
  heat:    { icon: '🔥', name: '猛暑',  hall: 1.12, grow: 0.5 },
  typhoon: { icon: '🌀', name: '台風',  hall: 0.55, grow: 0 },
};
const ACHIEVEMENTS = [
  { id: 'black',   name: 'はじめての黒字',        reward: 100000,   test: () => G.history.some(h => h.net + (h.farmNet || 0) > 0) },
  { id: 'm50',     name: '設置台数 50台',         reward: 500000,   test: () => G.machines.length >= 50 },
  { id: 'm100',    name: '設置台数 100台',        reward: 1000000,  test: () => G.machines.length >= 100 },
  { id: 'm300',    name: '設置台数 300台',        reward: 5000000,  test: () => G.machines.length >= 300 },
  { id: 'f1k',     name: 'フォロワー 1,000人',    reward: 200000,   test: () => G.farm.followers >= 1000 },
  { id: 'f10k',    name: 'フォロワー 1万人',      reward: 2000000,  test: () => G.farm.followers >= 10000 },
  { id: 'ec45',    name: 'EC評価 ★4.5',          reward: 500000,   test: () => G.farm.ec && G.farm.rating >= 4.5 },
  { id: 'plots',   name: '農園ランク「大農場」',   reward: 3000000,  test: () => G.farm.lv >= 4 },
  { id: 'soil',    name: '土Lv5の区画をつくる',   reward: 300000,   test: () => G.farm.soil.some(v => v >= 5) },
  { id: 'toku',    name: '特日で出率105%超え',    reward: 300000,   test: () => G.history.some(h => h.ev === 2 && h.avgPay > 1.05) },
  { id: 'writer',  name: '来店取材で大当たり',    reward: 500000,   test: () => G.flags.writerWin },
  { id: 'rival',   name: 'ライバル店を撤退させる', reward: 3000000,  test: () => G.flags.rivalBeat },
  { id: 'oku',     name: '資金 1億円',            reward: 0,        test: () => G.money >= 1e8 },
];
const RIVALS = ['パーラー銀河', 'ホール・ダイナマイト', 'メガパーク王国', 'スーパーアリーナ'];

function newExtras(g) {
  g.hire = g.hire || { setter: false, manager: false, sns: false, eventer: false, farmer: false, mode: 'balance' };
  g.weather = g.weather || 'sun';
  g.flags = g.flags || {};
  g.achieved = g.achieved || [];
  const f = g.farm;
  if (f.lv === undefined) { f.lv = 0; while (f.lv < FARM_LV.length - 1 && FARM_LV[f.lv].plots < f.plots.length) f.lv++; }
  f.fac = f.fac || {};
  f.soil = f.soil || f.plots.map(() => 1);
  while (f.soil.length < f.plots.length) f.soil.push(1);
  f.mode = f.mode || 'plant';
  for (const c of CROPS) if (f.priceLv[c.id] === undefined) f.priceLv[c.id] = 1;
  g.rival = g.rival || { name: RIVALS[0], power: 40, idx: 0, lose: 0, mod: 5 };
  return g;
}
const hired = id => G.hire[id];
const hireCost = () => HIRES.reduce((a, h) => a + (G.hire[h.id] ? h.wage : 0), 0);
const wx = () => WEATHER[G.weather];
// the rival runs events on days ending in its own digit, and a big one on the 15th
function rivalEventOf(d) {
  if (!G.rival || G.rival.gone) return 0;
  const dt = dateOf(d).getDate();
  return dt === 15 ? 2 : dt % 10 === G.rival.mod ? 1 : 0;
}
function rollWeather(d) {
  const m = monthOf(d), r = Math.random();
  if ((m >= 8 && m <= 10) && r < 0.06) return 'typhoon';
  if ((m >= 7 && m <= 8) && r < 0.3) return 'heat';
  return r < 0.22 ? 'rain' : 'sun';
}

// runs at the start of a day: specialists do their jobs
function autoStaff(d) {
  const ev = eventOf(d);
  if (hired('setter')) {
    const mode = SETTER_MODES.find(x => x.id === G.hire.mode);
    const [base, ratio, hi] = ev ? mode.event : mode.normal;
    // hot machines go to the most popular models, rotating daily so regulars keep guessing
    const ranked = G.machines.slice().sort((a, b) => popNow(MODEL[b.model], d) - popNow(MODEL[a.model], d) || ((a.id * 7 + d) % 11) - ((b.id * 7 + d) % 11));
    const hot = new Set(ranked.slice(0, Math.round(G.machines.length * ratio)).map(m => m.id));
    for (const m of G.machines) m[ev ? 'e' : 's'] = hot.has(m.id) ? hi : base;
  }
  if (hired('manager')) {
    G.staff = staffNeed();
    for (const m of G.machines) if (m.broken) { m.broken = 0; G.money -= 10000; }
  }
  const f = G.farm;
  if (hired('farmer')) {
    f.plots.forEach((p, i) => { if (p && p.prog >= CROP[p.crop].grow) harvest(i, true); });
    const pick = CROPS.filter(c => cropOpen(c) && (inSeason(c, d) || hasFac('house'))).sort((a, b) => b.yield * b.price / b.grow - a.yield * a.price / a.grow)[0] || CROPS[0];
    f.plots.forEach((p, i) => {
      if (!p && G.money > pick.seed + 300000) { G.money -= pick.seed; f.plots[i] = { crop: pick.id, prog: 0, ripe: 0, season: inSeason(pick, d) }; }
    });
    f.hands = Math.max(f.hands, handsNeed());
    // without a net shop everything goes to JA; with one, only stock about to spoil
    for (const s of f.stock) if (!f.ec || freshDays(CROP[s.crop]) - (d - s.day) <= 1) {
      const rev = s.qty * CROP[s.crop].price * WHOLESALE;
      G.money += rev; f.shipped = (f.shipped || 0) + rev; s.qty = 0;
    }
    f.stock = f.stock.filter(s => s.qty > 0);
  }
  if (hired('eventer')) {
    const units = f.stock.reduce((a, s) => a + s.qty, 0);
    const has = t => f.events.some(e => e.type === t);
    const book = t => { const def = FARM_EVENTS.find(x => x.id === t); if (G.money > def.cost + 500000) { G.money -= def.cost; f.events.push({ type: t, day: d + def.lead }); } };
    if (units > 120 && !has('marche')) book('marche');
    if (f.followers > 800 && !has('taiken') && d % 14 === 0) book('taiken');
    if (f.followers > 2000 && !has('matsuri') && d % 30 === 0) book('matsuri');
  }
  if (hired('sns') && f.posted !== d) {
    const soonEv = [1, 2, 3].some(k => eventOf(d + k));
    const type = soonEv && f.hallBoost < 0.3 ? 'hall' : f.events.length && f.eventBoost < 0.6 ? 'event' : f.stock.length && f.ec ? 'harvest' : 'recipe';
    post(type, true);
  }
}

// runs after a day: happenings, rival, achievements, next weather
function afterDay(d, h) {
  G.money -= hireCost();
  h.hireCost = hireCost();
  const f = G.farm;

  // famous writer visit judged on the day
  if (G.writerDay === d) {
    if (h.avgPay >= 1.03) { G.trust = clamp(G.trust + 12, 0, 100); G.rep = clamp(G.rep + 6, 0, 100); G.flags.writerWin = true; note(`来店取材が大成功！ 出率 ${pct(h.avgPay)} で一気に話題に`); toast('来店取材、大成功！'); }
    else { G.trust = clamp(G.trust - 12, 0, 100); note(`来店取材なのに出率 ${pct(h.avgPay)}… がっかりされました`); }
    G.writerDay = null;
  }
  // rival
  const r = G.rival;
  if (!r.gone) {
    r.power = clamp(r.power + (Math.random() - 0.45) * 0.6, 20, 95);
    r.lose = G.rep > r.power + 10 ? r.lose + 1 : Math.max(0, r.lose - 1);
    if (r.lose >= 30) {
      r.gone = true; r.back = d + 45; G.flags.rivalBeat = true;
      note(`ライバル「${r.name}」が撤退！ 地域のお客さんを独り占め`); toast(`ライバル「${r.name}」撤退！`);
    }
  } else if (d >= r.back) {
    r.idx++; Object.assign(r, { gone: false, name: RIVALS[r.idx % RIVALS.length], power: 50 + r.idx * 10, lose: 0, mod: [5, 3, 8, 1][r.idx % 4] });
    note(`新しいライバル「${r.name}」がオープン（強さ ${Math.round(r.power)}）`);
  }

  // random happenings
  const roll = Math.random();
  if (roll < 0.04 && G.machines.length) {
    const m = G.machines[rnd(G.machines.length)];
    m.broken = 1;
    note(`${m.id}番台（${MODEL[m.model].name}）が故障${hired('manager') ? '。店長が明日朝に修理します' : '。経営タブから修理してください'}`);
  } else if (roll < 0.07 && !G.writerDay) {
    G.writerDay = d + 3;
    note(`${fmtDate(d + 3)} に有名ライターの来店取材が決定！ その日の出率が勝負`);
    toast('来店取材が決まりました！');
  } else if (roll < 0.09) {
    const gain = 200 + rnd(600);
    f.followers += gain;
    note(`農園がテレビの地元特集で紹介された！ フォロワー +${gain}`);
  } else if (roll < 0.11) {
    for (const p of f.plots) if (p) p.prog += 2;
    note('天候に恵まれて畑の育ちが早まった（＋2日）');
  }
  if (G.weather === 'typhoon') {
    f.plots.forEach((p, i) => { if (p && Math.random() < (hasFac('house') ? 0.1 : 0.2)) { f.plots[i] = null; note(`台風で${CROP[p.crop].name}の畑が1区画やられた…`); } });
  }

  // achievements
  for (const a of ACHIEVEMENTS) if (!G.achieved.includes(a.id) && a.test()) {
    G.achieved.push(a.id); G.money += a.reward;
    note(`実績「${a.name}」達成！${a.reward ? ` ボーナス ${man(a.reward)}` : ''}`);
    toast(`🏆 実績「${a.name}」達成！`);
  }
  G.weather = rollWeather(d + 1);
}

function viewStaff() {
  const rows = HIRES.map(h => `<div class="item"><div class="info"><b>${h.name}</b><small>${h.desc}・日給 ${yen(h.wage)}</small></div>
    <button class="btn ${G.hire[h.id] ? '' : 'sub'}" data-act="hire" data-v="${h.id}">${G.hire[h.id] ? '雇用中' : '雇う'}</button></div>`).join('');
  const modes = SETTER_MODES.map(m => `<button class="cbtn ${G.hire.mode === m.id ? 'on' : ''}" data-act="mode" data-v="${m.id}">${m.name}</button>`).join('');
  const broken = G.machines.filter(m => m.broken);
  return `<div class="card"><h3><span>専門スタッフ</span><span class="num">人件費 ${yen(hireCost())}/日</span></h3>${rows}
      <div class="chips" style="gap:6px"><span style="width:auto">設定士の方針</span>${modes}</div>
      <p class="muted">設定士を雇うと、設定タブの手動設定は毎朝上書きされます。雇用中のボタンをもう一度押すと解雇します。</p></div>
    ${broken.length ? `<div class="card"><h3>故障中の台</h3>${broken.map(m => `<div class="item"><div class="info"><b>${m.id}番 ${esc(MODEL[m.model].name)}</b><small>修理しないと稼働しません</small></div><button class="btn" data-act="repair" data-v="${m.id}">修理 ${man(20000)}</button></div>`).join('')}</div>` : ''}`;
}
function viewRival() {
  const r = G.rival;
  let next = '';
  for (let d = G.day; d < G.day + 31; d++) { const e = rivalEventOf(d); if (e) { next = `${fmtDate(d)} ${e === 2 ? '大型イベント' : 'イベント'}`; break; } }
  return `<div class="card"><h3><span>ライバル店</span><span>${r.gone ? '撤退中' : esc(r.name)}</span></h3>
    ${r.gone ? `<p class="muted">${fmtDate(r.back)} ごろ新しいライバルが来そうです。</p>` : `
      <div class="stats"><div class="stat"><small>強さ</small><b>${Math.round(r.power)}</b></div>
      <div class="stat"><small>次のイベント</small><b style="font-size:12px">${next || '—'}</b></div>
      <div class="stat"><small>撤退まで</small><b>${r.lose}/30日</b></div></div>
      <p class="muted">${r.mod}のつく日と15日にイベントをします。その日はお客さんを取られますが、同じ日にこちらもイベ日にすると、評判とイベ信頼度が高いほうがお客さんを奪えます。評判がライバルの強さを10以上上回る日が続くと撤退します。</p>`}</div>`;
}
function viewAchievements() {
  return `<div class="card"><h3><span>実績</span><span>${G.achieved.length}/${ACHIEVEMENTS.length}</span></h3>
    ${ACHIEVEMENTS.map(a => `<div class="item"><div class="info"><b>${G.achieved.includes(a.id) ? '🏆' : '・'} ${a.name}</b><small>${a.reward ? 'ボーナス ' + man(a.reward) : '名誉のみ'}</small></div><span class="${G.achieved.includes(a.id) ? 'pos' : 'muted'}">${G.achieved.includes(a.id) ? '達成' : '未達成'}</span></div>`).join('')}</div>`;
}

// ---------- Actions ----------
$('main').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName === 'SELECT' || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'bulk') {
    for (const m of G.machines) if (m.model === b.dataset.model) m[b.dataset.key] = +b.dataset.v;
  } else if (a === 'day') {
    const d = +b.dataset.d;
    const cur = eventOf(d);
    const nxt = (cur + 1) % 3;
    const auto = RULES.find(r => r.id === G.rule).fn(dateOf(d));
    if (nxt === auto) delete G.manual[d]; else G.manual[d] = nxt;
  } else if (a === 'cal') {
    calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + +b.dataset.v, 1);
  } else if (a === 'buy') {
    const m = MODEL[b.dataset.model], n = +b.dataset.n;
    if (seats() - G.machines.length < n || G.money < m.price * n) return;
    for (let i = 0; i < n; i++) G.machines.push({ id: G.nextId++, model: m.id, s: 1, e: 4, seen: 1.0, util: 0, pay: 0 });
    G.money -= m.price * n;
    toast(`「${m.name}」を${n}台導入しました`);
  } else if (a === 'sell') {
    const i = G.machines.map(m => m.model).lastIndexOf(b.dataset.model);
    if (i < 0) return;
    G.machines.splice(i, 1);
    G.money += MODEL[b.dataset.model].price * SELL_BACK;
  } else if (a === 'expand') {
    const nl = LEVELS[G.level + 1];
    if (!nl || G.money < nl.cost) return;
    G.money -= nl.cost; G.level++;
    note(`${nl.name}にリニューアル！ 最大${nl.seats}台まで置けるように`);
    toast(`${nl.name}にリニューアル！`);
  } else if (a === 'staff') {
    G.staff = Math.max(1, G.staff + +b.dataset.v);
  } else if (a === 'ad') {
    G.ad = +b.dataset.v;
  } else if (a === 'hire') {
    G.hire[b.dataset.v] = !G.hire[b.dataset.v];
    const h = HIRES.find(x => x.id === b.dataset.v);
    toast(G.hire[h.id] ? `${h.name}を雇いました` : `${h.name}を解雇しました`);
  } else if (a === 'mode') {
    G.hire.mode = b.dataset.v;
  } else if (a === 'repair') {
    const m = G.machines.find(x => x.id === +b.dataset.v);
    if (m && G.money >= 20000) { m.broken = 0; G.money -= 20000; toast(`${m.id}番台を修理しました`); }
  } else if (a.startsWith('f-')) {
    farmAction(a, b);
  } else if (a === 'reset') {
    showOver('やり直しますか？', '今のお店のデータは消えます。', [['やり直す', reset], ['やめる', closeOver, true]]);
    return;
  }
  save(); renderStatus(); renderMain();
});
$('main').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'one') { const m = G.machines.find(x => x.id === +t.dataset.id); if (m) m[t.dataset.key] = +t.value; }
  else if (t.dataset.act === 'rule') { G.rule = t.value; renderMain(); }
  else if (t.id === 'nameIn') { G.name = t.value.trim() || 'ホール ラッキー'; renderStatus(); }
  save(); renderStatus();
});

let toastT;
function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1500); }
function showOver(title, html, btns) {
  const o = $('over');
  o.innerHTML = `<div class="card"><h2>${title}</h2><p class="muted" style="font-size:13px">${html}</p><div class="btns" style="justify-content:center">${btns.map(([l], i) => `<button class="btn ${btns[i][2] ? 'sub' : ''}" data-i="${i}">${l}</button>`).join('')}</div></div>`;
  o.hidden = false;
  o.querySelectorAll('button').forEach(b => b.onclick = btns[+b.dataset.i][1]);
}
function closeOver() { $('over').hidden = true; }
function reset() { stopAuto(); G = newExtras(newGame()); calMonth = null; closeOver(); save(); render(); }

G = newExtras(load() || newGame());
render();
</script>
