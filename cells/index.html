<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ぱくぱくセル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&display=swap">
<style>
  /* Layout: full-screen canvas arena; HUD floats in the corners, start/death card centered. Light grid look on purpose, single theme. */
  :root {
    --bg: #f2f5f8;
    --ink: #1d2733;
    --muted: #6b7a8c;
    --panel: rgba(255,255,255,.86);
    --accent: #ff5a3c;
    --line: #d9e1ea;
    --display: "Rubik", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: var(--display); touch-action: none; user-select: none; -webkit-user-select: none; }
  #cv { position: fixed; inset: 0; display: block; }
  #mini { display: block; }
  .hud { position: fixed; pointer-events: none; z-index: 2; }
  #resetBtn { position: fixed; z-index: 3; top: calc(48px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px));
    border: 0; border-radius: 10px; padding: 6px 12px; font: inherit; font-weight: 800; font-size: 13px; background: var(--panel); color: var(--ink); cursor: pointer; }
  #resetBtn.armed { background: var(--accent); color: #fff; }
  #resetBtn:focus-visible { outline: 3px solid #3a86ff; outline-offset: 2px; }
  #contrib { top: calc(88px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px));
    background: var(--panel); border-radius: 10px; padding: 6px 10px; font-size: 11px; min-width: 130px; font-variant-numeric: tabular-nums; }
  #contrib b { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  #contrib div { color: #0ead69; font-weight: 800; display: flex; justify-content: space-between; gap: 10px; }
  #score { top: calc(10px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px));
    background: var(--panel); border-radius: 10px; padding: 6px 12px; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
  #board { top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
    background: var(--panel); border-radius: 10px; padding: 8px 10px; font-size: 12px; min-width: 140px; max-width: 46vw; }
  #board h4 { margin: 0 0 4px; font-size: 13px; text-align: center; letter-spacing: .04em; }
  #board ol { margin: 0; padding-left: 20px; }
  #board li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.45; }
  #board li.me { color: var(--accent); font-weight: 800; }
  #board li.ally { color: #0ead69; font-weight: 800; }
  #mini { left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    width: 110px; height: 110px; background: var(--panel); border-radius: 10px; }
  .btns { position: fixed; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 12px; z-index: 3; }
  .btns button { width: 72px; height: 72px; border-radius: 50%; border: 0; font: inherit; font-weight: 800; font-size: 14px;
    color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.18); opacity: .88; }
  #splitBtn { background: var(--accent); }
  #ejectBtn { background: #3a86ff; }
  #feedBtn { background: #0ead69; line-height: 1.15; }
  #flash { left: 50%; top: calc(56px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: rgba(29,39,51,.85); color: #fff;
    padding: 6px 14px; border-radius: 99px; font-size: 13px; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  @media (max-width: 400px) { .btns button { width: 64px; height: 64px; font-size: 13px; } .btns { gap: 8px; } }
  .btns button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  #menu { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; z-index: 5; background: rgba(242,245,248,.55); }
  #menu[hidden] { display: none; }
  .card { background: #fff; border-radius: 22px; padding: 26px 22px; width: 100%; max-width: 340px; text-align: center;
    box-shadow: 0 12px 40px rgba(29,39,51,.18); display: grid; gap: 14px; }
  .card h1 { margin: 0; font-size: 34px; font-weight: 800; color: var(--accent); letter-spacing: .02em; }
  .card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
  .card input { font: inherit; font-size: 16px; padding: 12px; border-radius: 12px; border: 2px solid var(--line); text-align: center; color: var(--ink); background: #fff; }
  .card input:focus-visible, .card button:focus-visible { outline: 3px solid #3a86ff; outline-offset: 2px; }
  .card button { font: inherit; font-weight: 800; font-size: 18px; padding: 14px; border: 0; border-radius: 14px; background: var(--accent); color: #fff; cursor: pointer; }
  .result { font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .result b { font-size: 28px; display: block; }
  @media (hover: hover) and (pointer: fine) { .btns { display: none; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="score" class="hud"></div>
<div id="contrib" class="hud"></div>
<button id="resetBtn" hidden>↺ リセット</button>
<div id="board" class="hud"><h4>ランキング</h4><ol id="rank"></ol></div>
<canvas id="mini" class="hud"></canvas>
<div id="flash" class="hud"></div>
<div class="btns"><button id="feedBtn" aria-label="味方に質量をもらう">ちょう<br>だい</button><button id="ejectBtn" aria-label="質量を発射">発射</button><button id="splitBtn" aria-label="分裂">分裂</button></div>
<div id="menu"><div class="card">
  <h1>ぱくぱくセル</h1>
  <div id="result" class="result" hidden></div>
  <input id="nameIn" maxlength="12" placeholder="なまえ" aria-label="なまえ">
  <button id="playBtn">あそぶ</button>
  <p>指（マウス）の方向に進む。自分より小さいセルを食べて大きくなろう。<br>分裂：スペース／発射：W／味方にもらう：E<br>敵はいない。みんな味方！★の3体はあなたについてきて手伝ってくれる。味方とは大きさしだいでお互い食べられる。</p>
</div></div>

<script>
// ---------- Tuning ----------
const WORLD = 6000, FOOD_N = 7000, VIRUS_N = 24, BOT_N = 125;
const START_MASS = 12, MIN_SPLIT = 35, MAX_CELLS = 16, EJECT_COST = 16, EJECT_MASS = 13;
const VIRUS_MASS = 100, VIRUS_FEED = 7, EAT_RATIO = 1.25;
const COLORS = ['#ff5a3c', '#ff9f1c', '#ffd23f', '#3bceac', '#0ead69', '#3a86ff', '#8338ec', '#ff006e', '#00b4d8', '#f15bb5', '#9ef01a', '#fb8500'];
const BOT_NAMES = ['もちもち', 'たこやき', 'ぷにぷに', 'まんまる', 'うさぎ団', 'ねむねむ', 'ころころ', 'ふわふわ', 'しろくま', 'メロンパン',
  'おにぎり', 'てんとう虫', 'ぴよぴよ', 'ゼリー', 'みかん', 'アメーバ', 'ばくだん', 'とうふ', 'こんぺいとう', 'だんご', 'はらぺこ', 'すいか', 'ラムネ', 'わたあめ', 'くらげ'];

const ALLY_NAMES = ['ナイト', 'ガード', 'サポート'];
const ALLY_MASS = 35, ALLY_FOOD = 1.5, KILL_SHARE = 0.5, AUTO_FEED_S = 5;
const CARRY_SHARE = 0.85, CARRY_TRIP = 25, CARRY_DROP = 20; // free-roaming friends haul food to the player
const isCarrier = o => !!o.team && !o.follower && !o.isPlayer;
const sameTeam = (a, b) => a === b || (a.team && a.team === b.team);
// the three ★ allies stick with the player; every other bot is a friendly free roamer
const isFollower = o => !!o.follower;
const SHIELD_MS = 3000; // a fresh player can't be eaten for a moment
const radius = m => Math.sqrt(m) * 6;
const speedOf = m => 520 * Math.pow(m, -0.33);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- State ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const mini = document.getElementById('mini'), mctx = mini.getContext('2d');
let W = 0, H = 0, DPR = 1;
let owners = [], cells = [], food = [], ejects = [], viruses = [];
let me = null, playing = false, cam = { x: WORLD / 2, y: WORLD / 2, z: 1 };
let pointer = { x: 0, y: 0 }, nextId = 1, best = 0, startT = 0;

// food lives in a coarse grid so each cell only checks pellets nearby
const GS = 200, GN = Math.ceil(WORLD / GS);
let grid = [];
function gridKey(x, y) { return clamp(Math.floor(y / GS), 0, GN - 1) * GN + clamp(Math.floor(x / GS), 0, GN - 1); }
function addFood(f) { f.k = gridKey(f.x, f.y); grid[f.k].push(f); }
function spawnFood() { const f = { x: rand(0, WORLD), y: rand(0, WORLD), c: pick(COLORS), m: 1 }; addFood(f); return f; }

function resetWorld() {
  owners = []; cells = []; ejects = []; viruses = [];
  grid = Array.from({ length: GN * GN }, () => []);
  food = []; for (let i = 0; i < FOOD_N; i++) food.push(spawnFood());
  for (let i = 0; i < VIRUS_N; i++) viruses.push(newVirus(rand(200, WORLD - 200), rand(200, WORLD - 200)));
  for (let i = 0; i < BOT_N; i++) spawnOwner(BOT_NAMES[i % BOT_NAMES.length] + (i >= BOT_NAMES.length ? Math.floor(i / BOT_NAMES.length) + 1 : ''), false, rand(12, 120)).team = 'me';
}
function newVirus(x, y) { return { x, y, m: VIRUS_MASS, vx: 0, vy: 0, fed: 0 }; }
function spawnOwner(name, isPlayer, mass = START_MASS) {
  const o = { id: nextId++, name, color: pick(COLORS), isPlayer, alive: true, tx: 0, ty: 0, think: 0, peak: mass };
  owners.push(o);
  const p = safeSpot();
  cells.push(newCell(o, p.x, p.y, mass));
  o.tx = p.x; o.ty = p.y;
  return o;
}
// pick the candidate spot farthest from any bigger danger
function safeSpot() {
  let best = null, bestGap = -Infinity;
  for (let t = 0; t < 60; t++) {
    const x = rand(300, WORLD - 300), y = rand(300, WORLD - 300);
    let gap = Infinity;
    for (const c of cells) gap = Math.min(gap, Math.hypot(c.x - x, c.y - y) - radius(c.m) * 3);
    if (gap > bestGap) { bestGap = gap; best = { x, y }; }
    if (gap > 600) break;
  }
  return best;
}
function newCell(o, x, y, m) { return { id: nextId++, o, x, y, m, vx: 0, vy: 0, mergeAt: 0 }; }
const cellsOf = o => cells.filter(c => c.o === o);
const massOf = o => cellsOf(o).reduce((a, c) => a + c.m, 0);

// ---------- Actions ----------
function split(o) {
  const mine = cellsOf(o);
  for (const c of mine) {
    if (c.m < MIN_SPLIT || cellsOf(o).length >= MAX_CELLS) continue;
    const a = Math.atan2(o.ty - c.y, o.tx - c.x);
    const half = c.m / 2;
    c.m = half;
    const n = newCell(o, c.x + Math.cos(a) * radius(half), c.y + Math.sin(a) * radius(half), half);
    const boost = 780 + radius(half) * 2;
    n.vx = Math.cos(a) * boost; n.vy = Math.sin(a) * boost;
    const merge = performance.now() + 9000 + half * 25;
    n.mergeAt = merge; c.mergeAt = merge;
    cells.push(n);
  }
}
function eject(o, aim) {
  for (const c of cellsOf(o)) {
    if (c.m < EJECT_COST + 12) continue;
    const a = Math.atan2((aim ? aim.y : o.ty) - c.y, (aim ? aim.x : o.tx) - c.x) + rand(-0.1, 0.1);
    c.m -= EJECT_COST;
    const r = radius(c.m);
    const v = isFollower(o) ? 1700 : 900; // gifts fly farther so a moving player can catch them
    ejects.push({ x: c.x + Math.cos(a) * r, y: c.y + Math.sin(a) * r, vx: Math.cos(a) * v, vy: Math.sin(a) * v, m: EJECT_MASS, c: o.color, born: performance.now(), gift: isFollower(o) ? o : null });
  }
}
// a cell that eats a virus bursts into many small pieces
function burst(c) {
  const o = c.o, room = MAX_CELLS - cellsOf(o).length;
  if (room <= 0) return;
  const pieces = Math.min(room, Math.max(2, Math.floor(c.m / 20)));
  const each = c.m / (pieces + 1);
  c.m = each;
  const now = performance.now();
  c.mergeAt = now + 12000;
  for (let i = 0; i < pieces; i++) {
    const a = (i / pieces) * Math.PI * 2 + rand(-0.2, 0.2);
    const n = newCell(o, c.x, c.y, each);
    n.vx = Math.cos(a) * 650; n.vy = Math.sin(a) * 650; n.mergeAt = now + 12000 + each * 20;
    cells.push(n);
  }
}

// an ally's kill also feeds the player a share, so teamwork pays off
function shareKill(ally, prey) {
  const mine = cellsOf(me);
  if (!mine.length) return;
  const bonus = prey.m * KILL_SHARE;
  mine.reduce((a, c) => c.m > a.m ? c : a).m += bonus;
  ally.given = (ally.given || 0) + bonus;
  if (bonus >= 8) flash(`${ally.name}が「${prey.o.name}」を倒した！ +${Math.round(bonus)}`);
}
// allies shoot some of their mass toward the player
// allies come over and shoot some of their mass at the player
function askFeed() {
  let n = 0;
  for (const o of owners) {
    if (!isFollower(o) || !o.alive || massOf(o) < 60) continue;
    o.feed = 3; o.think = 0; n++;
  }
  flash(n ? `味方 ${n}体 が分けに来てくれるよ！` : '味方がまだ小さくて分けられない…');
}
let flashT = 0;
function flash(t) { const el = document.getElementById('flash'); el.textContent = t; el.style.opacity = 1; clearTimeout(flashT); flashT = setTimeout(() => el.style.opacity = 0, 1400); }

// ---------- Bots ----------
// where an ally heads to stay with the player: a big ally keeps a gap so it doesn't swallow the player by accident
function followPoint(leader, big) {
  if (big.m < leader.m * 1.1) return { x: leader.x, y: leader.y };
  const dx = big.x - leader.x, dy = big.y - leader.y, d = Math.hypot(dx, dy) || 1;
  const gap = radius(leader.m) + radius(big.m) + 120;
  return { x: leader.x + dx / d * gap, y: leader.y + dy / d * gap };
}
// hand a parcel of mass to the player; only the player can pick it up
function giveGift(o, from, to, m) {
  const a = Math.atan2(to.y - from.y, to.x - from.x) + rand(-0.05, 0.05), r = radius(from.m);
  // ejects glide about speed/5.5 before stopping, so pick the speed that lands on the player's centre
  const dist = Math.max(0, Math.hypot(to.x - from.x, to.y - from.y) - r);
  const v = clamp(dist * 5.5, 200, 2600);
  ejects.push({ x: from.x + Math.cos(a) * r, y: from.y + Math.sin(a) * r, vx: Math.cos(a) * v, vy: Math.sin(a) * v, m, c: o.color, born: performance.now(), gift: o });
}
function botThink(o) {
  const mine = cellsOf(o);
  if (!mine.length) return;
  const big = mine.reduce((a, c) => c.m > a.m ? c : a);
  if (isCarrier(o)) {
    const L = me && me.alive ? cellsOf(me).reduce((a, c) => !a || c.m > a.m ? c : a, null) : null;
    if (L && ((o.carry || 0) >= CARRY_TRIP || (o.delivering && o.carry >= 1))) {
      // walk over, stop a little short so nobody gets swallowed, and hand the food over
      o.delivering = true;
      const dx = big.x - L.x, dy = big.y - L.y, d = Math.hypot(dx, dy) || 1, gap = radius(L.m) + radius(big.m) + 150;
      o.tx = L.x + dx / d * gap; o.ty = L.y + dy / d * gap; o.far = d > gap + 400;
      if (d < gap + 60) { const m = Math.min(o.carry, CARRY_DROP); giveGift(o, big, L, m); o.carry -= m; o.think = 0.15; }
      return;
    }
    o.delivering = false; o.far = false;
  }
  const r = radius(big.m), view = (isFollower(o) ? 700 : 500) + r * (isFollower(o) ? 5 : 4);
  const leader = isFollower(o) && me && me.alive ? cellsOf(me).reduce((a, c) => !a || c.m > a.m ? c : a, null) : null;
  let fx = 0, fy = 0, prey = null, preyScore = 0;
  for (const c of cells) {
    if (sameTeam(c.o, o)) continue;
    const dx = c.x - big.x, dy = c.y - big.y, d = Math.hypot(dx, dy);
    if (d > view) continue;
    // allies only hunt around the player
    if (leader && c.m < big.m && Math.hypot(c.x - leader.x, c.y - leader.y) > 900) continue;
    if (c.m > big.m * EAT_RATIO) {
      // while helping, allies brave the enemy that's pinned against the player
      if (o.team && crisis && c === crisis.e) continue;
      const w = (c.m / big.m) * 600 / Math.max(40, d - radius(c.m));
      fx -= dx / d * w; fy -= dy / d * w;
    } else if (big.m > c.m * EAT_RATIO) {
      // allies go first for enemies that are close to the player
      const guard = leader && Math.hypot(c.x - leader.x, c.y - leader.y) < radius(leader.m) + 400 ? 3 : 1;
      const s = c.m / Math.max(60, d) * guard;
      if (s > preyScore) { preyScore = s; prey = c; }
    }
  }
  // allies drift back toward the player, and run that way when chased
  if (leader) {
    const dx = leader.x - big.x, dy = leader.y - big.y, d = Math.hypot(dx, dy) || 1;
    if (d > 450 + radius(leader.m) && Math.hypot(fx, fy) > 0.6) { fx += dx / d * 1.5; fy += dy / d * 1.5; }
  }
  if (!isFollower(o) && big.m > VIRUS_MASS * 1.3) for (const v of viruses) {
    const dx = v.x - big.x, dy = v.y - big.y, d = Math.hypot(dx, dy);
    if (d < r + 160) { fx -= dx / d * 2; fy -= dy / d * 2; }
  }
  let tx, ty;
  const now = performance.now();
  if (leader && !o.feed && now > (o.nextGift || 0) && big.m > 70 && massOf(o) > massOf(me) * 0.35) { o.feed = 2; o.nextGift = now + AUTO_FEED_S * 1000; }
  // the player is stuck against an enemy it can't eat yet: help it win
  if (isFollower(o) && crisis && Math.hypot(fx, fy) < 6) {
    const { pc, e } = crisis;
    if (big.m > e.m * EAT_RATIO) {
      // strong enough to take the enemy ourselves
      o.tx = e.x; o.ty = e.y; o.far = true;
      if (big.m / 2 > e.m * EAT_RATIO && Math.hypot(e.x - big.x, e.y - big.y) < 420 + r && mine.length < 8) split(o);
      return;
    }
    if (mine.every(c => c.m * EAT_RATIO <= pc.m)) {
      // small enough to be swallowed: dive into the player to make it bigger
      o.tx = pc.x; o.ty = pc.y; o.far = true; o.sacrifice = now;
      return;
    }
    o.feedTarget = pc;
    if (!o.feed) o.feed = Math.min(6, Math.ceil(crisis.need / EJECT_MASS) + 1);
  }
  if (o.feed > 0 && leader && Math.hypot(fx, fy) < 4) {
    const ft = o.feedTarget && cells.includes(o.feedTarget) ? o.feedTarget : leader;
    const fp = followPoint(ft, big); o.tx = fp.x; o.ty = fp.y;
    if (Math.hypot(ft.x - big.x, ft.y - big.y) < radius(ft.m) + r + 260) { eject(o, ft); o.feed--; o.think = 0.12; if (!o.feed) o.feedTarget = null; }
    else o.far = true;
    return;
  }
  // allies sweep away spikes near the player
  let spike = null;
  if (leader) {
    let bd = Infinity;
    for (const v of viruses) {
      if (Math.hypot(v.x - leader.x, v.y - leader.y) > radius(leader.m) + 700) continue;
      const d = Math.hypot(v.x - big.x, v.y - big.y);
      if (d < bd) { bd = d; spike = v; }
    }
  }
  // an ally far from the player heads straight back unless something big is right on it
  const far = leader && Math.hypot(leader.x - big.x, leader.y - big.y) > 700 + radius(leader.m);
  o.far = !!far;
  const fear = Math.hypot(fx, fy);
  if (spike && fear < 4) { tx = spike.x; ty = spike.y; }
  else if (fear > (far ? 4 : isFollower(o) ? 2 : 0.6)) { tx = big.x + fx * 300; ty = big.y + fy * 300; }
  else if (far) { const fp = followPoint(leader, big); tx = fp.x; ty = fp.y; }
  else if (prey) {
    tx = prey.x; ty = prey.y;
    const d = Math.hypot(prey.x - big.x, prey.y - big.y);
    if (big.m / 2 > prey.m * EAT_RATIO && d < (isFollower(o) ? 420 : 320) + r && mine.length < (isFollower(o) ? 8 : 4) && Math.random() < (isFollower(o) ? 0.6 : 0.3)) { o.tx = tx; o.ty = ty; split(o); }
  } else if (leader && Math.hypot(leader.x - big.x, leader.y - big.y) > 450 + radius(leader.m)) {
    // too far from the player: catch up
    const fp = followPoint(leader, big); tx = fp.x + rand(-150, 150); ty = fp.y + rand(-150, 150);
  } else {
    // drift toward the densest nearby food
    let bestF = null, bd = Infinity;
    const k0x = Math.floor(big.x / GS), k0y = Math.floor(big.y / GS);
    for (let gy = k0y - 2; gy <= k0y + 2; gy++) for (let gx = k0x - 2; gx <= k0x + 2; gx++) {
      if (gx < 0 || gy < 0 || gx >= GN || gy >= GN) continue;
      for (const f of grid[gy * GN + gx]) { const d = (f.x - big.x) ** 2 + (f.y - big.y) ** 2; if (d < bd) { bd = d; bestF = f; } }
    }
    if (bestF) { tx = bestF.x; ty = bestF.y; }
    else { tx = o.tx + rand(-400, 400); ty = o.ty + rand(-400, 400); }
  }
  o.tx = clamp(tx, 0, WORLD); o.ty = clamp(ty, 0, WORLD);
}

// ---------- Update ----------
// new spikes grow back away from the player
function spotAwayFromPlayer() {
  const mine = me && me.alive ? cellsOf(me) : [];
  for (let t = 0; t < 20; t++) {
    const x = rand(200, WORLD - 200), y = rand(200, WORLD - 200);
    if (mine.every(c => Math.hypot(c.x - x, c.y - y) > 1500)) return { x, y };
  }
  return { x: rand(200, WORLD - 200), y: rand(200, WORLD - 200) };
}
// a player cell touching an enemy it can't eat yet; pick the one closest to winnable
let crisis = null;
function findCrisis() {
  if (!me || !me.alive) return null;
  let bestC = null;
  for (const pc of cellsOf(me)) {
    const rp = radius(pc.m);
    for (const e of cells) {
      if (e.o.team || pc.m >= e.m * EAT_RATIO) continue;
      if (Math.hypot(e.x - pc.x, e.y - pc.y) > rp + radius(e.m) + 60) continue;
      const need = e.m * EAT_RATIO - pc.m + 2;
      if (!bestC || need < bestC.need) bestC = { pc, e, need };
    }
  }
  return bestC;
}
function update(dt) {
  const now = performance.now();
  if (me && me.alive) {
    const p = screenToWorld(pointer.x, pointer.y);
    me.tx = p.x; me.ty = p.y;
  }
  const prevCrisis = crisis;
  crisis = findCrisis();
  if (crisis && !prevCrisis) for (const o of owners) if (isFollower(o)) o.think = 0;
  for (const o of owners) if (!o.isPlayer && o.alive && (o.think -= dt) <= 0) { o.think = rand(0.15, 0.35); botThink(o); }

  // move cells
  for (const c of cells) {
    const o = c.o, r = radius(c.m);
    const dx = o.tx - c.x, dy = o.ty - c.y, d = Math.hypot(dx, dy) || 1;
    const sp = speedOf(c.m) * Math.min(1, d / (r + 30)) * (o.feed > 0 ? 2 : o.far ? 1.6 : 1);
    c.x += (dx / d * sp + c.vx) * dt; c.y += (dy / d * sp + c.vy) * dt;
    const damp = Math.pow(0.02, dt); c.vx *= damp; c.vy *= damp;
    c.x = clamp(c.x, r * 0.5, WORLD - r * 0.5); c.y = clamp(c.y, r * 0.5, WORLD - r * 0.5);
    if (c.m > 400) c.m -= c.m * 0.002 * dt;
  }
  // own cells: push apart until they may merge, then merge
  const byOwner = new Map();
  for (const c of cells) { if (!byOwner.has(c.o)) byOwner.set(c.o, []); byOwner.get(c.o).push(c); }
  for (const list of byOwner.values()) {
    for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
      const a = list[i], b = list[j];
      if (a.dead || b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01, ra = radius(a.m), rb = radius(b.m);
      if (now > a.mergeAt && now > b.mergeAt) {
        if (d < Math.max(ra, rb) * 0.9) { const [big, small] = a.m >= b.m ? [a, b] : [b, a]; big.m += small.m; small.dead = true; }
      } else if (d < ra + rb) {
        const push = (ra + rb - d) * 0.5;
        const sa = b.m / (a.m + b.m), sb = a.m / (a.m + b.m);
        a.x -= dx / d * push * sa; a.y -= dy / d * push * sa;
        b.x += dx / d * push * sb; b.y += dy / d * push * sb;
      }
    }
  }
  cells = cells.filter(c => !c.dead);

  // eat food
  for (const c of cells) {
    const r = radius(c.m);
    const x0 = Math.floor((c.x - r) / GS), x1 = Math.floor((c.x + r) / GS), y0 = Math.floor((c.y - r) / GS), y1 = Math.floor((c.y + r) / GS);
    for (let gy = Math.max(0, y0); gy <= Math.min(GN - 1, y1); gy++) for (let gx = Math.max(0, x0); gx <= Math.min(GN - 1, x1); gx++) {
      const b = grid[gy * GN + gx];
      for (let i = b.length - 1; i >= 0; i--) {
        const f = b[i];
        if ((f.x - c.x) ** 2 + (f.y - c.y) ** 2 < r * r) {
          if (isCarrier(c.o)) { c.o.carry = (c.o.carry || 0) + f.m * CARRY_SHARE; c.m += f.m * (1 - CARRY_SHARE); }
          else c.m += f.m * (isFollower(c.o) ? ALLY_FOOD : 1);
          b.splice(i, 1);
          f.x = rand(0, WORLD); f.y = rand(0, WORLD); f.c = pick(COLORS); addFood(f);
        }
      }
    }
  }
  // ejected mass: fly, then can be eaten or fed to viruses
  for (const e of ejects) {
    e.x += e.vx * dt; e.y += e.vy * dt;
    const damp = Math.pow(0.004, dt); e.vx *= damp; e.vy *= damp;
    e.x = clamp(e.x, 0, WORLD); e.y = clamp(e.y, 0, WORLD);
    for (const v of viruses) {
      if (e.dead) break;
      if (Math.hypot(v.x - e.x, v.y - e.y) < radius(v.m)) {
        e.dead = true; v.m += EJECT_MASS * 0.3; v.fed++;
        if (v.fed >= VIRUS_FEED) {
          // an overfed virus splits and shoots a new one where it was fed from
          v.fed = 0; v.m = VIRUS_MASS;
          const a = Math.atan2(e.vy, e.vx), n = newVirus(v.x, v.y);
          n.vx = Math.cos(a) * 1000; n.vy = Math.sin(a) * 1000;
          viruses.push(n);
        }
      }
    }
    if (e.dead) continue;
    if (e.gift && now - e.born > 15000) e.gift = null; // an uncollected parcel becomes ordinary food
    const young = now - e.born < 250;
    // an ally's gift is only for the player (who can catch it right away); enemies can still steal it
    for (const c of cells) {
      if (e.gift ? (c.o !== me && (c.o.team || young)) : young) continue;
      if ((e.gift || c.m > EJECT_MASS * 1.1) && Math.hypot(c.x - e.x, c.y - e.y) < radius(c.m)) { c.m += e.m; e.dead = true; if (e.gift && c.o === me) e.gift.given = (e.gift.given || 0) + e.m; break; }
    }
  }
  ejects = ejects.filter(e => !e.dead);
  for (const v of viruses) {
    v.x += v.vx * dt; v.y += v.vy * dt;
    const damp = Math.pow(0.01, dt); v.vx *= damp; v.vy *= damp;
    v.x = clamp(v.x, 60, WORLD - 60); v.y = clamp(v.y, 60, WORLD - 60);
  }
  // cells eat viruses (and burst)
  for (const c of cells) {
    const ally = isFollower(c.o);
    if (!ally && c.m < VIRUS_MASS * 1.3) continue;
    for (const v of viruses) {
      if (v.dead) continue;
      const d = Math.hypot(c.x - v.x, c.y - v.y);
      if (ally) {
        // allies don't burst: they break the spike apart
        if (d < radius(c.m) + radius(v.m) * 0.6) { v.dead = true; c.m += 15; c.o.cleared = (c.o.cleared || 0) + 1; break; }
        continue;
      }
      if (d < radius(c.m) - radius(v.m) * 0.4) { v.dead = true; c.m += v.m; burst(c); break; }
    }
  }
  viruses = viruses.filter(v => !v.dead);
  while (viruses.length < VIRUS_N) { const p = spotAwayFromPlayer(); viruses.push(newVirus(p.x, p.y)); }

  // cells eat other owners' cells
  cells.sort((a, b) => b.m - a.m);
  for (let i = 0; i < cells.length; i++) {
    const a = cells[i];
    if (a.dead) continue;
    const ra = radius(a.m);
    for (let j = i + 1; j < cells.length; j++) {
      const b = cells[j];
      if (b.dead || b.o === a.o || a.m < b.m * EAT_RATIO || b.o.shield > now || (sameTeam(a.o, b.o) && a.o !== me && b.o !== me)) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      if (Math.abs(dx) > ra || Math.abs(dy) > ra) continue;
      if (Math.hypot(dx, dy) < ra - radius(b.m) * 0.4) {
        a.m += b.m; b.dead = true;
        if (isFollower(a.o) && !b.o.team && me && me.alive) shareKill(a.o, b);
        if (a.o === me && isFollower(b.o)) { b.o.given = (b.o.given || 0) + b.m; if (crisis) flash(`${b.o.name}が体を差し出した！ +${Math.round(b.m)}`); }
      }
    }
  }
  cells = cells.filter(c => !c.dead);

  // deaths and respawns
  for (const o of owners) {
    if (!o.alive) continue;
    const m = massOf(o);
    if (m === 0) {
      o.alive = false; o.diedAt = now;
      if (o === me) gameOver();
    } else o.peak = Math.max(o.peak, m);
  }
  for (const o of owners) if (!o.isPlayer && !o.alive && now - o.diedAt > 3000) {
    if (isFollower(o) && !(me && me.alive)) continue;
    o.alive = true; o.peak = START_MASS;
    if (isFollower(o)) { const c = cellsOf(me)[0]; cells.push(newCell(o, c.x + rand(-200, 200), c.y + rand(-200, 200), ALLY_MASS)); o.shield = now + SHIELD_MS; continue; }
    o.color = pick(COLORS);
    const p = safeSpot(); cells.push(newCell(o, p.x, p.y, rand(12, 40)));
  }
  owners = owners.filter(o => o.alive || !o.isPlayer || o === me);
}

// ---------- Camera & drawing ----------
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  mini.width = 110 * DPR; mini.height = 110 * DPR;
}
addEventListener('resize', resize);
function screenToWorld(sx, sy) { return { x: cam.x + (sx - W / 2) / cam.z, y: cam.y + (sy - H / 2) / cam.z }; }
function updateCam(dt) {
  let tx = cam.x, ty = cam.y, tz;
  const mine = me ? cellsOf(me) : [];
  const base = Math.min(W, H) / 900;
  if (mine.length) {
    let m = 0; tx = 0; ty = 0;
    for (const c of mine) { tx += c.x * c.m; ty += c.y * c.m; m += c.m; }
    tx /= m; ty /= m;
    const rTot = mine.reduce((a, c) => a + radius(c.m), 0);
    tz = base * Math.pow(Math.min(64 / rTot, 1), 0.4) * 1.4;
  } else tz = base * 0.7;
  const k = Math.min(1, dt * 5);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k; cam.z += (tz - cam.z) * Math.min(1, dt * 2);
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#f2f5f8'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(cam.z, cam.z); ctx.translate(-cam.x, -cam.y);
  const vw = W / 2 / cam.z, vh = H / 2 / cam.z;
  const x0 = cam.x - vw, x1 = cam.x + vw, y0 = cam.y - vh, y1 = cam.y + vh;
  // grid
  ctx.strokeStyle = '#dde4ec'; ctx.lineWidth = 1 / cam.z;
  ctx.beginPath();
  for (let x = Math.max(0, Math.floor(x0 / 50) * 50); x <= Math.min(WORLD, x1); x += 50) { ctx.moveTo(x, Math.max(0, y0)); ctx.lineTo(x, Math.min(WORLD, y1)); }
  for (let y = Math.max(0, Math.floor(y0 / 50) * 50); y <= Math.min(WORLD, y1); y += 50) { ctx.moveTo(Math.max(0, x0), y); ctx.lineTo(Math.min(WORLD, x1), y); }
  ctx.stroke();
  ctx.strokeStyle = '#9fb0c2'; ctx.lineWidth = 6; ctx.strokeRect(0, 0, WORLD, WORLD);
  // food
  const gx0 = Math.max(0, Math.floor(x0 / GS)), gx1 = Math.min(GN - 1, Math.floor(x1 / GS));
  const gy0 = Math.max(0, Math.floor(y0 / GS)), gy1 = Math.min(GN - 1, Math.floor(y1 / GS));
  for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) for (const f of grid[gy * GN + gx]) {
    ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(f.x, f.y, 7, 0, Math.PI * 2); ctx.fill();
  }
  for (const e of ejects) { ctx.fillStyle = e.c; ctx.beginPath(); ctx.arc(e.x, e.y, radius(e.m), 0, Math.PI * 2); ctx.fill(); }
  // cells under viruses when smaller, over them when bigger
  const vis = cells.filter(c => { const r = radius(c.m); return c.x + r > x0 && c.x - r < x1 && c.y + r > y0 && c.y - r < y1; }).sort((a, b) => a.m - b.m);
  for (const c of vis) if (c.m < VIRUS_MASS) drawCell(c);
  for (const v of viruses) if (v.x > x0 - 100 && v.x < x1 + 100 && v.y > y0 - 100 && v.y < y1 + 100) drawVirus(v);
  for (const c of vis) if (c.m >= VIRUS_MASS) drawCell(c);
  ctx.restore();
  drawMini();
}
function drawCell(c) {
  const r = radius(c.m);
  ctx.fillStyle = c.o.color; ctx.strokeStyle = shade(c.o.color);
  ctx.lineWidth = Math.max(3, r * 0.06);
  ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  const left = (c.o.shield || 0) - performance.now();
  if (left > 0 && Math.floor(left / 150) % 2 === 0) {
    ctx.strokeStyle = 'rgba(58,134,255,.85)'; ctx.lineWidth = Math.max(4, r * 0.12);
    ctx.beginPath(); ctx.arc(c.x, c.y, r + ctx.lineWidth * 1.2, 0, Math.PI * 2); ctx.stroke();
  }
  if (r * cam.z > 10) {
    const fs = Math.max(10, r * 0.38);
    ctx.font = `800 ${fs}px Rubik, "Hiragino Sans", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = fs * 0.16; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.fillStyle = '#fff';
    ctx.strokeText(c.o.name, c.x, c.y); ctx.fillText(c.o.name, c.x, c.y);
    if (c.o === me) { ctx.font = `800 ${fs * 0.55}px Rubik, sans-serif`; ctx.strokeText(Math.round(c.m), c.x, c.y + fs * 0.85); ctx.fillText(Math.round(c.m), c.x, c.y + fs * 0.85); }
  }
}
function drawVirus(v) {
  const r = radius(v.m), spikes = 22;
  ctx.fillStyle = '#33dd55'; ctx.strokeStyle = '#1fa83a'; ctx.lineWidth = 5;
  ctx.beginPath();
  for (let i = 0; i <= spikes * 2; i++) {
    const a = i / (spikes * 2) * Math.PI * 2, rr = i % 2 ? r : r * 1.09;
    ctx.lineTo(v.x + Math.cos(a) * rr, v.y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
}
function shade(hex) {
  const n = parseInt(hex.slice(1), 16);
  return `rgb(${(n >> 16) * 0.75 | 0},${((n >> 8) & 255) * 0.75 | 0},${(n & 255) * 0.75 | 0})`;
}
function drawMini() {
  const s = 110 / WORLD;
  mctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  mctx.clearRect(0, 0, 110, 110);
  mctx.strokeStyle = '#dde4ec'; mctx.lineWidth = 1;
  for (let i = 1; i < 5; i++) { mctx.beginPath(); mctx.moveTo(i * 22, 0); mctx.lineTo(i * 22, 110); mctx.moveTo(0, i * 22); mctx.lineTo(110, i * 22); mctx.stroke(); }
  for (const c of cells) {
    if (c.o !== me && !isFollower(c.o) && c.m < 200) continue;
    mctx.fillStyle = c.o.color; mctx.beginPath(); mctx.arc(c.x * s, c.y * s, Math.max(1.5, radius(c.m) * s), 0, Math.PI * 2); mctx.fill();
  }
  if (me && me.alive) { mctx.strokeStyle = '#1d2733'; mctx.lineWidth = 1.5; mctx.beginPath(); mctx.arc(cam.x * s, cam.y * s, 5, 0, Math.PI * 2); mctx.stroke(); }
}

// ---------- HUD ----------
let hudT = 0;
function updateHud(dt) {
  if ((hudT -= dt) > 0) return;
  hudT = 0.4;
  const alive = owners.filter(o => o.alive).map(o => ({ o, m: massOf(o) })).sort((a, b) => b.m - a.m);
  const top = alive.slice(0, 10);
  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  let html = top.map(x => `<li class="${x.o === me ? 'me' : isFollower(x.o) ? 'ally' : ''}">${esc(x.o.name)}</li>`).join('');
  const myRank = alive.findIndex(x => x.o === me);
  if (myRank >= 10) html += `<li class="me" value="${myRank + 1}">${esc(me.name)}</li>`;
  document.getElementById('rank').innerHTML = html;
  if (me && me.alive) {
    const m = massOf(me); best = Math.max(best, m);
    document.getElementById('score').textContent = `大きさ ${Math.round(m)}`;
    const hauled = owners.filter(isCarrier).reduce((a, o) => a + (o.given || 0), 0);
    document.getElementById('contrib').innerHTML = `<b>みんなが運んできた量</b><div>味方${owners.filter(isCarrier).length}体<span>+${Math.round(hauled)}</span></div><b>★からもらった量</b>` + owners.filter(isFollower)
      .map(o => `<div>${esc(o.name)}<span>+${Math.round(o.given || 0)}${o.cleared ? `・トゲ${o.cleared}` : ''}</span></div>`).join('');
  }
}

// ---------- Flow ----------
const menu = document.getElementById('menu');
function start() {
  const name = document.getElementById('nameIn').value.trim() || 'あなた';
  try { localStorage.setItem('cells_name', name); } catch (e) {}
  // allies outlive the player: keep the ones still in the arena and come back next to the biggest
  const allies = owners.filter(isFollower);
  cells = cells.filter(c => !c.o.isPlayer);
  owners = owners.filter(o => !o.isPlayer);
  me = spawnOwner(name, true);
  me.team = 'me';
  me.shield = performance.now() + SHIELD_MS;
  const home = cellsOf(me)[0];
  if (allies.length) {
    me.color = allies[0].color;
    const lead = allies.filter(o => o.alive).sort((x, y) => massOf(y) - massOf(x))[0];
    const lc = lead && cellsOf(lead).sort((x, y) => y.m - x.m)[0];
    if (lc) { const a = rand(0, Math.PI * 2), d = radius(lc.m) + 140; home.x = clamp(lc.x + Math.cos(a) * d, 50, WORLD - 50); home.y = clamp(lc.y + Math.sin(a) * d, 50, WORLD - 50); }
    for (const o of allies) { o.shield = me.shield; o.think = 0; o.feed = 0; }
  } else for (const n of ALLY_NAMES) {
    const a = { id: nextId++, name: '★' + n, color: me.color, isPlayer: false, team: 'me', follower: true, alive: true, tx: home.x, ty: home.y, think: 0, peak: START_MASS, shield: me.shield };
    owners.push(a);
    cells.push(newCell(a, home.x + rand(-160, 160), home.y + rand(-160, 160), ALLY_MASS));
  }
  best = START_MASS; startT = performance.now(); playing = true;
  menu.hidden = true;
  document.getElementById('resetBtn').hidden = false;
  pointer = { x: W / 2, y: H / 2 };
}
function gameOver() {
  document.getElementById('resetBtn').hidden = true;
  playing = false;
  const secs = Math.round((performance.now() - startT) / 1000);
  const r = document.getElementById('result');
  r.hidden = false;
  r.innerHTML = `食べられちゃった！<b>最大 ${Math.round(best)}</b>${Math.floor(secs / 60)}分${secs % 60}秒 生きのびた`;
  document.getElementById('playBtn').textContent = 'もう一回';
  setTimeout(() => { menu.hidden = false; }, 900);
}
document.getElementById('playBtn').onclick = start;
document.getElementById('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
try { document.getElementById('nameIn').value = localStorage.getItem('cells_name') || ''; } catch (e) {}

// ---------- Input ----------
cv.addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY; });
cv.addEventListener('pointerdown', e => { pointer.x = e.clientX; pointer.y = e.clientY; });
addEventListener('keydown', e => {
  if (!playing || e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); split(me); }
  if (e.code === 'KeyW') eject(me);
  if (e.code === 'KeyE') askFeed();
});
const tapBtn = (id, fn) => document.getElementById(id).addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (playing) fn(me); });
// reset needs a second tap within 2s so a stray touch doesn't wipe the round
const resetBtn = document.getElementById('resetBtn');
let resetArmed = 0;
resetBtn.addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation();
  if (!playing) return;
  if (performance.now() < resetArmed) {
    resetArmed = 0; resetBtn.classList.remove('armed'); resetBtn.textContent = '↺ リセット';
    resetWorld(); start(); flash('最初からやり直し！');
    return;
  }
  resetArmed = performance.now() + 2000;
  resetBtn.classList.add('armed'); resetBtn.textContent = 'もう一度押すとリセット';
  setTimeout(() => { if (performance.now() >= resetArmed) { resetBtn.classList.remove('armed'); resetBtn.textContent = '↺ リセット'; } }, 2050);
});
tapBtn('splitBtn', split); tapBtn('ejectBtn', eject); tapBtn('feedBtn', askFeed);

// ---------- Loop ----------
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  update(dt); updateCam(dt); draw(); updateHud(dt);
  requestAnimationFrame(frame);
}
resize();
resetWorld();
requestAnimationFrame(frame);
</script>
</body>
